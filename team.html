<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль команды</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <style>
        .team-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }
        .team-header.win { border-top-color: var(--success); }
        .team-header.loss { border-top-color: var(--danger); }
        
        .team-logo {
            width: 80px;
            height: 80px;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 8px;
        }
        .team-title {
            font-family: var(--mono);
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
        }
        .team-status {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .team-status.win { color: var(--success); }
        .team-status.loss { color: var(--danger); }

        .hltv-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .hltv-table th {
            background: var(--surface-2);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .hltv-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text);
        }
        .hltv-table tr:last-child td { border-bottom: none; }
        .hltv-table tr:hover td { background: var(--surface-2); cursor: pointer; }
        
        .player-name-cell { font-weight: 700; color: var(--accent); }
        .stat-good { color: var(--success); font-weight: 700; }
        .stat-bad { color: var(--danger); font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right"><span class="status">● LIVE</span></div>
    </div>
    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div id="teamContent"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const teamId = urlParams.get('id');

    function renderTeam(id) {
        const container = document.getElementById('teamContent');
        if (!id || (id !== 'tf2' && id !== 'magic')) {
            container.innerHTML = `<div style="text-align:center;padding:40px;">Команда не найдена. <a href="index.html" style="color:var(--accent);">На главную</a></div>`;
            return;
        }

        const isWin = id === 'tf2';
        const teamData = isWin ? matchData.match0.total.teams.win : matchData.match0.total.teams.loss;
        const teamName = isWin ? 'Team Fortress 2' : 'Team Magic';
        const statusText = isWin ? 'Победа (2:0)' : 'Поражение (0:2)';
        const statusClass = isWin ? 'win' : 'loss';

        container.innerHTML = `
            <a href="index.html" class="back-btn">← На главную</a>
            
            <!-- HLTV-Header -->
            <div class="team-header ${statusClass}">
                <div class="team-logo">🛡</div>
                <div>
                    <div class="team-title">${teamName}</div>
                    <div class="team-status ${statusClass}">${statusText}</div>
                </div>
            </div>

            <!-- HLTV-Table -->
            <div style="font-family:var(--mono); font-size:14px; font-weight:700; margin-bottom:12px; text-transform:uppercase; color:var(--text);">Состав команды</div>
            <table class="hltv-table">
                <thead>
                    <tr>
                        <th>Игрок</th>
                        <th>K</th>
                        <th>D</th>
                        <th>A</th>
                        <th>ADR</th>
                        <th>+/-</th>
                    </tr>
                </thead>
                <tbody>
                    ${teamData.players.map(p => `
                        <tr onclick="location.href='player.html?name=${encodeURIComponent(p.name)}'">
                            <td class="player-name-cell">${p.name}</td>
                            <td>${p.k}</td>
                            <td>${p.d}</td>
                            <td>${p.a || 0}</td>
                            <td>${p.adr}</td>
                            <td class="${p.diff > 0 ? 'stat-good' : 'stat-bad'}">${p.diff > 0 ? '+' : ''}${p.diff}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }
    renderTeam(teamId);
</script>
</body>
</html>
