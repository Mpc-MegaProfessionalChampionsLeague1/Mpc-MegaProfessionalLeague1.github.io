<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Статистика</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1>
        </div>
        <div class="header-right">
            <span id="headerDate">📅 Май-Июль 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">🇬🇧 EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
        <a href="index.html" class="nav-btn">📊 Главная</a>
        <a href="matches.html" class="nav-btn">📋 Матчи</a>
        <a href="players.html" class="nav-btn">👥 Игроки</a>
        <a href="stats.html" class="nav-btn active">📈 Статистика</a>
        <a href="about.html" class="nav-btn">ℹ️ О сайте</a>
    </nav>

    <!-- STATS OVERVIEW -->
    <div class="grid-3" style="margin-bottom:16px;">
        <div class="stats-card">
            <div class="num" id="totalMatches">5</div>
            <div class="label">Всего матчей</div>
        </div>
        <div class="stats-card">
            <div class="num" id="totalPlayers">10</div>
            <div class="label">Всего игроков</div>
        </div>
        <div class="stats-card">
            <div class="num" id="totalKills">?</div>
            <div class="label">Всего убийств</div>
        </div>
    </div>

    <!-- CHARTS -->
    <div class="grid-2">
        <div class="glass-card">
            <div style="font-weight:600;margin-bottom:8px;color:#e8eff7;">📊 K/D всех игроков</div>
            <div id="kdChart"></div>
        </div>
        <div class="glass-card">
            <div style="font-weight:600;margin-bottom:8px;color:#e8eff7;">📈 Рейтинг всех игроков</div>
            <div id="ratingChart"></div>
        </div>
        <div class="glass-card">
            <div style="font-weight:600;margin-bottom:8px;color:#e8eff7;">💥 ADR всех игроков</div>
            <div id="adrChart"></div>
        </div>
        <div class="glass-card">
            <div style="font-weight:600;margin-bottom:8px;color:#e8eff7;">📊 Разница (±)</div>
            <div id="diffChart"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        MPL · Mega Professional League · <b>HLTV-style</b> · Май-Июль 2026
    </div>

</div>

<script src="script-loader.js"></script>

<script>
    // ==========================================================
    // ЖДЁМ ЗАГРУЗКИ ДАННЫХ
    // ==========================================================
    function initStats() {
        const playersData = window.playersData || [];
        const matchData = window.matchData || {};

        // Обновляем общую статистику
        document.getElementById('totalPlayers').textContent = playersData.length;
        document.getElementById('totalMatches').textContent = Object.keys(matchData).length;

        const totalKills = playersData.reduce((sum, p) => sum + (p.k || 0), 0);
        document.getElementById('totalKills').textContent = totalKills || '0';

        // Рендерим графики
        renderCharts(playersData);
    }

    function renderCharts(playersData) {
        if (!playersData || playersData.length === 0) {
            ['kdChart', 'ratingChart', 'adrChart', 'diffChart'].forEach(id => {
                document.getElementById(id).innerHTML = '<div style="text-align:center;color:#4a5a6e;padding:20px;">Нет данных</div>';
            });
            return;
        }

        const maxKd = Math.max(...playersData.map(p => p.kd || 0));
        const maxAdr = Math.max(...playersData.map(p => p.adr || 0));
        const maxDiff = Math.max(...playersData.map(p => Math.abs(p.diff || 0)));
        const maxRating = Math.max(...playersData.map(p => p.rating || 0));

        document.getElementById('kdChart').innerHTML = [...playersData].sort((a, b) => (b.kd || 0) - (a.kd || 0)).map(p => `
            <div style="display:flex;align-items:center;gap:5px;margin:2px 0;font-size:10px;">
                <span style="min-width:70px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:12px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${maxKd > 0 ? (p.kd || 0)/maxKd*100 : 0}%;background:linear-gradient(90deg,#2a475e,#4a7a9e);border-radius:3px;"></div>
                </div>
                <span style="min-width:32px;font-weight:600;">${(p.kd || 0).toFixed(2)}</span>
            </div>
        `).join('');

        document.getElementById('ratingChart').innerHTML = [...playersData].sort((a, b) => (b.rating || 0) - (a.rating || 0)).map(p => `
            <div style="display:flex;align-items:center;gap:5px;margin:2px 0;font-size:10px;">
                <span style="min-width:70px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:12px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${maxRating > 0 ? (p.rating || 0)/maxRating*100 : 0}%;background:linear-gradient(90deg,#2a475e,#4a7a9e);border-radius:3px;"></div>
                </div>
                <span style="min-width:32px;font-weight:600;">${(p.rating || 0).toFixed(2)}</span>
            </div>
        `).join('');

        document.getElementById('adrChart').innerHTML = [...playersData].sort((a, b) => (b.adr || 0) - (a.adr || 0)).map(p => `
            <div style="display:flex;align-items:center;gap:5px;margin:2px 0;font-size:10px;">
                <span style="min-width:70px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:12px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${maxAdr > 0 ? (p.adr || 0)/maxAdr*100 : 0}%;background:linear-gradient(90deg,#2d7d46,#5cb85c);border-radius:3px;"></div>
                </div>
                <span style="min-width:32px;font-weight:600;">${p.adr || 0}</span>
            </div>
        `).join('');

        document.getElementById('diffChart').innerHTML = [...playersData].sort((a, b) => (b.diff || 0) - (a.diff || 0)).map(p => `
            <div style="display:flex;align-items:center;gap:5px;margin:2px 0;font-size:10px;">
                <span style="min-width:70px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:12px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${maxDiff > 0 ? Math.abs(p.diff || 0)/maxDiff*100 : 0}%;background:${(p.diff || 0) >= 0 ? 'linear-gradient(90deg,#2d7d46,#5cb85c)' : 'linear-gradient(90deg,#c0392b,#e74c3c)'};border-radius:3px;"></div>
                </div>
                <span style="min-width:32px;font-weight:600;">${(p.diff || 0) > 0 ? '+' : ''}${p.diff || 0}</span>
            </div>
        `).join('');
    }

    // ==========================================================
    // ТЕМА / ЯЗЫК
    // ==========================================================
    function toggleTheme() {
        document.body.classList.toggle('light');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '🌙' : '🌙';
    }

    let lang = 'ru';

    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('langBtn').textContent = lang === 'ru' ? '🇬🇧 EN' : '🇷🇺 RU';
    }

    // ==========================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ==========================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStats);
    } else {
        initStats();
    }

    // Если данные загружаются через script-loader.js
    document.addEventListener('dataLoaded', function() {
        initStats();
    });

    // Резерв: проверяем наличие данных
    let attempts = 0;
    const checkData = setInterval(() => {
        attempts++;
        if (window.playersData && window.playersData.length > 0) {
            clearInterval(checkData);
            initStats();
        } else if (attempts > 20) {
            clearInterval(checkData);
            console.warn('⚠️ Данные не загружены');
            initStats();
        }
    }, 500);
</script>

</body>
</html>
