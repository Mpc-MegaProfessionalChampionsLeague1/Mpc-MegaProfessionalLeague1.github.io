<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Сравнение игроков</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=52">
    <style>
        .compare-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .compare-header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); padding: 30px; border-radius: 6px; }
        .compare-player { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .compare-avatar { width: 100px; height: 100px; background: var(--bg); border: 2px solid var(--border-2); border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .compare-avatar img.bg { position: absolute; width: 80%; height: 80%; opacity: 0.3; z-index: 1; object-fit: contain; }
        .compare-avatar img.player { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
        .compare-name { font-size: 24px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .compare-team { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .vs-circle { width: 60px; height: 60px; background: var(--surface-2); border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; font-weight: 800; color: var(--accent); margin: 0 20px; }

        .stat-row { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 15px 20px; border-radius: 6px; }
        .stat-val { font-family: var(--mono); font-size: 20px; font-weight: 800; width: 80px; }
        .stat-val.left { text-align: right; color: var(--text); }
        .stat-val.right { text-align: left; color: var(--text); }
        .stat-val.winner { color: var(--accent); }
        
        .stat-bar-container { flex: 1; margin: 0 20px; display: flex; flex-direction: column; align-items: center; }
        .stat-name { font-size: 11px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .dual-bars { display: flex; width: 100%; height: 10px; gap: 4px; }
        .bar-left { height: 100%; background: #66c0f4; border-radius: 2px 0 0 2px; transition: width 0.5s; }
        .bar-right { height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; transition: width 0.5s; }
        
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body class="theme-terminal">
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div>
                    <select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;">
                        <option value="theme-terminal">Terminal (Зеленая)</option>
                        <option value="theme-cyberpunk">Cyberpunk (Розовая)</option>
                        <option value="theme-ocean">Ocean (Синяя)</option>
                        <option value="theme-blood">Blood Moon (Красная)</option>
                        <option value="theme-matrix">Matrix (Черно-зеленая)</option>
                    </select>
                </div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <div style="margin: 20px 0;">
        <a href="players.html" class="back-btn">← Назад к игрокам</a>
    </div>

    <div class="page-title">⚔️ Сравнение игроков</div>
    <div class="page-subtitle">Кто из них сильнее? Статистика бок о бок.</div>

    <div id="compareContent" class="compare-container"></div>
</div>

<script src="js/data.js"></script>
<script>
    const tf2Roster = ['bomba69', 'Хомяк с авт', 'uxaxaxaxa', 'AFKE'];
    const magicRoster = ['abdalbek', 'Gonduras228', 'Adjiare Gudju', 'baksyhanovvand...'];
    const defaultImg = 'img/default.png';
    const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`;
    const flagSVG = `<svg viewBox="0 0 100 70" style="width:24px; height:16px; border-radius:2px; display:inline-block; vertical-align:middle;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;

    const urlParams = new URLSearchParams(window.location.search);
    const p1Name = urlParams.get('p1');
    const p2Name = urlParams.get('p2');

    function getTeamLogo(name) {
        if (tf2Roster.includes(name)) return 'img/tf2.png';
        if (magicRoster.includes(name)) return 'img/magic.png';
        return fallbackSVG;
    }

    function getTeamName(name) {
        if (tf2Roster.includes(name)) return 'Team Fortress 2';
        if (magicRoster.includes(name)) return 'Team Magic';
        return 'Без команды';
    }

    function renderCompare() {
        const container = document.getElementById('compareContent');
        
        if (!p1Name || !p2Name) {
            container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--muted);">Выберите двух игроков на странице <a href="players.html" style="color:var(--accent);">Игроки</a>.</div>';
            return;
        }

        const p1 = playersData.find(p => p.name === p1Name);
        const p2 = playersData.find(p => p.name === p2Name);

        if (!p1 || !p2) {
            container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--danger);">Один из игроков не найден.</div>';
            return;
        }

        const createHeaderCard = (player) => {
            const logo = getTeamLogo(player.name);
            const team = getTeamName(player.name);
            return `
                <div class="compare-player" onclick="location.href='player.html?name=${encodeURIComponent(player.name)}'" style="cursor:pointer;">
                    <div class="compare-avatar">
                        <img src="${logo}" class="bg" onerror="this.src='${fallbackSVG}';">
                        <img src="${defaultImg}" class="player">
                    </div>
                    <div class="compare-name">${flagSVG} ${player.name}</div>
                    <div class="compare-team">${team}</div>
                </div>
            `;
        };

        const createStatRow = (label, val1, val2, isHigherBetter = true, isPercent = false) => {
            const v1 = parseFloat(val1);
            const v2 = parseFloat(val2);
            
            let p1Better = isHigherBetter ? (v1 > v2) : (v1 < v2);
            let p2Better = isHigherBetter ? (v2 > v1) : (v2 < v1);
            if (v1 === v2) { p1Better = false; p2Better = false; }

            const max = Math.max(v1, v2) || 1;
            const width1 = (v1 / max) * 100;
            const width2 = (v2 / max) * 100;

            return `
                <div class="stat-row">
                    <div class="stat-val left ${p1Better ? 'winner' : ''}">${val1}${isPercent ? '%' : ''}</div>
                    <div class="stat-bar-container">
                        <div class="stat-name">${label}</div>
                        <div class="dual-bars">
                            <div class="bar-left" style="width: ${width1}%;"></div>
                            <div class="bar-right" style="width: ${width2}%; margin-left: auto;"></div>
                        </div>
                    </div>
                    <div class="stat-val right ${p2Better ? 'winner' : ''}">${val2}${isPercent ? '%' : ''}</div>
                </div>
            `;
        };

        const getWinrate = (name) => {
            let wins = 0, total = 0;
            Object.keys(matchData).forEach(key => {
                const m = matchData[key];
                const teams = m.teams || (m.total && m.total.teams);
                if (!teams) return;
                const score1 = parseInt(m.score.split(':')[0]);
                const score2 = parseInt(m.score.split(':')[1]);
                const winnerSide = score1 > score2 ? 'win' : 'loss'; 
                const loserSide = score1 > score2 ? 'loss' : 'win';
                if (teams[winnerSide] && teams[winnerSide].players && teams[winnerSide].players.some(p => p.name === name)) { wins++; total++; }
                if (teams[loserSide] && teams[loserSide].players && teams[loserSide].players.some(p => p.name === name)) { total++; }
            });
            return total > 0 ? Math.round((wins / total) * 100) : 0;
        };

        const wr1 = getWinrate(p1.name);
        const wr2 = getWinrate(p2.name);

        container.innerHTML = `
            <div class="compare-header">
                ${createHeaderCard(p1)}
                <div class="vs-circle">VS</div>
                ${createHeaderCard(p2)}
            </div>

            ${createStatRow('Рейтинг (Rating)', p1.rating.toFixed(2), p2.rating.toFixed(2))}
            ${createStatRow('K/D Ratio', p1.kd.toFixed(2), p2.kd.toFixed(2))}
            ${createStatRow('ADR (Средний урон)', p1.adr, p2.adr)}
            ${createStatRow('Убийства (Kills)', p1.k, p2.k)}
            ${createStatRow('Смерти (Deaths)', p1.d, p2.d, false)} 
            ${createStatRow('Сыграно матчей', p1.matches, p2.matches)}
            ${createStatRow('Винрейт', wr1, wr2, true, true)}
        `;
    }

    // ==========================================
    // СИНХРОНИЗАЦИЯ ТЕМ (КАК НА ДРУГИХ СТРАНИЦАХ)
    // ==========================================
    function toggleTheme() { 
        document.body.classList.toggle('light'); 
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; 
    }
    let lang = 'ru';
    function toggleLang() { 
        lang = lang === 'ru' ? 'en' : 'ru'; 
        document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; 
    }
    function toggleSettings() { 
        const panel = document.getElementById('settingsPanel'); 
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; 
    }
    function changeTheme(themeName) { 
        localStorage.setItem('mpl_theme', themeName); 
        document.body.className = themeName; 
        location.reload(); 
    }
    function resetBg() { 
        document.body.style.backgroundImage = 'none'; 
        document.body.style.backgroundColor = 'var(--bg)'; 
        localStorage.removeItem('mpl_bg'); 
        document.getElementById('bgUpload').value = ''; 
    }
    document.getElementById('bgUpload').addEventListener('change', function(e) { 
        const file = e.target.files[0]; 
        if (file) { 
            const reader = new FileReader(); 
            reader.onload = function(event) { 
                document.body.style.backgroundImage = `url(${event.target.result})`; 
                document.body.style.backgroundSize = 'cover'; 
                document.body.style.backgroundPosition = 'center'; 
                localStorage.setItem('mpl_bg', event.target.result); 
            }; 
            reader.readAsDataURL(file); 
        } 
    });

    window.addEventListener('DOMContentLoaded', () => { 
        // Восстанавливаем сохраненную тему
        const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal'; 
        document.body.className = savedTheme; 
        
        // Восстанавливаем селект
        const select = document.getElementById('themeSelect'); 
        if (select) select.value = savedTheme; 
        
        // Восстанавливаем фон
        const savedBg = localStorage.getItem('mpl_bg'); 
        if (savedBg) { 
            document.body.style.backgroundImage = `url(${savedBg})`; 
            document.body.style.backgroundSize = 'cover'; 
            document.body.style.backgroundPosition = 'center'; 
        } 
    });

    // Запуск рендера
    renderCompare();
</script>

<script src="js/nav.js"></script>
</body>
</html>
