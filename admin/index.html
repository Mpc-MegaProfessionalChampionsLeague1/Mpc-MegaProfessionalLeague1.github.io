<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPL — Админ-панель</title>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <!-- Decap CMS автоматически создаст интерфейс в этом элементе -->
  <div id="root"></div>

  <script>
    // Ждём загрузки CMS
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Decap CMS загружается...');
      
      // Функция для проверки готовности CMS
      function checkCMS() {
        if (typeof window.CMS !== 'undefined' && window.CMS.init) {
          console.log('CMS готов к инициализации');
          // CMS инициализируется автоматически через config.yml
        } else {
          console.log('Ожидаем загрузку CMS...');
          setTimeout(checkCMS, 500);
        }
      }
      
      checkCMS();
    });
  </script>
</body>
</html>
