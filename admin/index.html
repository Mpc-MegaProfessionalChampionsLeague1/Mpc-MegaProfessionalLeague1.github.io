<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPL — Админ-панель</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
    <!-- Decap CMS автоматически создаст интерфейс -->
    <script>
        // Decap CMS инициализируется автоматически
        // Конфигурация загружается из config.yml
        console.log('Decap CMS загружается...');
        
        // Проверяем, что CMS загрузился
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Страница загружена, ожидаем CMS...');
        });
    </script>
</body>
</html>
