<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Зал славы</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=48">
    <style>
        .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .achievement-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: transform 0.2s; }
        .achievement-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .ach-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .medal-main { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; box-shadow: inset 0 3px 5px rgba(255,255,255,0.5), inset 0 -3px 5px rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.4); }
        .medal-gold { background: radial-gradient(circle at 30% 30%, #fff599, #ffcc00, #b38600); border: 1px solid #ffe066; }
        .medal-fire { background: radial-gradient(circle at 30% 30%, #ff9933, #ff3300, #800000); border: 1px solid #ff6633; }
        .medal-ice { background: radial-gradient(circle at 30% 30%, #ccffff, #3399ff, #003366); border: 1px solid #66ccff; }
        .medal-bronze { background: radial-gradient(circle at 30% 30%, #ffb380, #cd7f32, #804d1a); border: 1px solid #e69966; }
        .achievement-title { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .achievement-desc { font-size: 11px; color: var(--muted); }
        .top-list { display: flex; flex-direction: column; gap: 8px; }
        .top-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; border: 1px solid var(--border); }
        .rank-badge { font-family: var(--mono); font-size: 12px; font-weight: 800; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .rank-1 { background: #ffd700; color: #000; } .rank-2 { background: #c0c0c0; color: #000; } .rank-3 { background: #cd7f32; color: #000; }
        .top-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
        .top-value { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); }
        .achievement-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); filter: blur(60px); opacity: 0.03; z-index: 0; pointer-events: none; }
        .achievement-card > * { z-index: 1; }
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body class="theme-terminal">
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div><div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div><select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;"><option value="theme-terminal">Terminal (Зеленая)</option><option value="theme-cyberpunk">Cyberpunk (Розовая)</option><option value="theme-ocean">Ocean (Синяя)</option><option value="theme-blood">Blood Moon (Красная)</option><option value="theme-matrix">Matrix (Черно-зеленая)</option></select></div>
                <div><div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div><input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;"><button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button></div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn active">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div class="page-title">🏆 Зал славы</div>
    <div class="page-subtitle">Топ-3 игрока в каждой категории</div>

    <div class="hall-grid" id="hallGrid"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const achievementsList = [
        { title: 'Лучший K/D', desc: 'Наивысший коэффициент убийств/смертей', icon: '🎯', medalClass: 'medal-gold', statType: 'kd', format: 'float' },
        { title: 'Доминатор', desc: 'Лучшая разница убийств и смертей', icon: '⚡', medalClass: 'medal-fire', statType: 'diff', format: 'plus' },
        { title: 'Урон-машина', desc: 'Наивысший средний урон за раунд (ADR)', icon: '💥', medalClass: 'medal-gold', statType: 'adr', format: 'int' },
        { title: 'Хладнокровие', desc: 'Лучший рейтинг (Rating)', icon: '🧊', medalClass: 'medal-ice', statType: 'rating', format: 'float' },
        { title: 'Жажда крови', desc: 'Больше всего убийств за всё время', icon: '🩸', medalClass: 'medal-fire', statType: 'k', format: 'int' },
        { title: 'Ветеран', desc: 'Сыграл больше всего матчей', icon: '🏅', medalClass: 'medal-bronze', statType: 'matches', format: 'int' }
    ];

    function formatValue(value, type) { if (type === 'float') return value.toFixed(2); if (type === 'plus') return (value > 0 ? '+' : '') + value; return value; }

    function renderHall() {
        const container = document.getElementById('hallGrid');
        container.innerHTML = achievementsList.map(ach => {
            const top3 = [...playersData].sort((a, b) => b[ach.statType] - a[ach.statType]).slice(0, 3);
            return `
                <div class="achievement-card">
                    <div class="ach-header"><div class="medal-main ${ach.medalClass}">${ach.icon}</div><div><div class="achievement-title">${ach.title}</div><div class="achievement-desc">${ach.desc}</div></div></div>
                    <div class="top-list">
                        ${top3.map((p, index) => `
                            <div class="top-item" onclick="location.href='player.html?name=${encodeURIComponent(p.name)}'" style="cursor:pointer;">
                                <div class="rank-badge rank-${index + 1}">#${index + 1}</div>
                                <div class="top-name">${p.name}</div>
                                <div class="top-value">${formatValue(p[ach.statType], ach.format)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }
    function changeTheme(themeName) { localStorage.setItem('mpl_theme', themeName); document.body.className = themeName; location.reload(); }
    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    document.getElementById('bgUpload').addEventListener('change', function(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); } });
    window.addEventListener('DOMContentLoaded', () => { const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal'; document.body.className = savedTheme; const select = document.getElementById('themeSelect'); if (select) select.value = savedTheme; const savedBg = localStorage.getItem('mpl_bg'); if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; } });

    renderHall();
</script>
</body>
</html>
