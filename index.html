<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Главная</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
    <style>
        /* Дополнительные стили для вкладок в левой колонке */
        .team-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .team-card:hover { transform: translateX(4px); background: var(--surface-2); }
        .team-card.win { border-left: 3px solid var(--success); }
        .team-card.loss { border-left: 3px solid var(--danger); }
    </style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
        <a href="index.html" class="nav-btn active">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <!-- MAIN GRID -->
    <div class="main-grid">
        <!-- LEFT: PLAYERS / TEAMS -->
        <div class="glass-card" style="display:flex; flex-direction:column;">
            <div class="panel-title">🏆 <span>Рейтинги</span></div>
            
            <!-- Вкладки Игроки / Команды -->
            <div style="display:flex; margin-bottom:12px; border:1px solid var(--border);">
                <button class="sub-nav-btn active" onclick="switchLeftTab('players')" id="tabPlayersBtn" style="flex:1; padding:8px;">Игроки</button>
                <button class="sub-nav-btn" onclick="switchLeftTab('teams')" id="tabTeamsBtn" style="flex:1; padding:8px; border-left:1px solid var(--border);">Команды</button>
            </div>

            <!-- БЛОК: ИГРОКИ -->
            <div id="leftContentPlayers" style="display:block;">
                <div class="month-filter" id="monthFilter" style="margin-bottom:12px;"></div>
                <div style="display:flex;gap:3px;margin-bottom:10px;background:rgba(255,255,255,0.03);border-radius:0;padding:3px;border:1px solid var(--border);">
                    <button class="sub-nav-btn" onclick="switchTop('kd')" id="subKd">📊 K/D</button>
                    <button class="sub-nav-btn active" onclick="switchTop('rating')" id="subRating">📈 Rating</button>
                </div>
                <div class="podium-container" id="podiumContainer"></div>
                <div class="scroll-area" id="playerList"></div>
                <div style="font-size:10px;color:var(--muted);margin-top:12px;text-align:center;border-top:1px solid var(--border);padding-top:12px;font-family:var(--mono);">
                    🟣 <b style="color:var(--accent);" id="topFooterName">bomba69</b> — <span id="topFooterText">лидер по рейтингу</span>
                    <span id="monthInfo" style="display:block;color:var(--dim);font-size:9px;margin-top:2px;">за всё время</span>
                </div>
            </div>

            <!-- БЛОК: КОМАНДЫ -->
            <div id="leftContentTeams" style="display:none;">
                <div id="teamListContainer"></div>
            </div>
        </div>

        <!-- CENTER: NEWS -->
        <div class="glass-card">
            <div class="panel-title">📰 <span>Новости</span></div>
            <div id="newsList" style="display:flex;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto;"></div>
        </div>

        <!-- RIGHT: MATCHES -->
        <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="panel-title" style="padding:0 4px 8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);">📋 <span>Матчи</span></div>
            <div id="matchList" style="display:flex;flex-direction:column;gap:8px;max-height:600px;overflow-y:auto;"></div>
        </div>
    </div>

    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    // ===== НОВОСТИ =====
    const newsData = [
        { id: 1, title: '🏆 Старт сезона MPL!', text: 'Дружеский турнир MPL начался!', date: '2026-05-09T10:00:00.000Z' },
        { id: 2, title: '🔥 Bomba69 делает 26-11!', text: 'В матче #5 Bomba69 показал невероятный результат — 26 убийств!', date: new Date().toISOString() },
        { id: 3, title: '📊 Добавлен фильтр по месяцам!', text: 'Теперь можно смотреть топ за конкретный месяц.', date: new Date().toISOString() }
    ];

    function renderNews() {
        const container = document.getElementById('newsList');
        container.innerHTML = newsData.sort((a, b) => new Date(b.date) - new Date(a.date)).map(n => `
            <div class="news-item">
                <div class="news-header"><span class="news-title">${n.title}</span><span class="news-meta">✏️ MPL</span></div>
                <div class="news-text">${n.text}</div>
            </div>
        `).join('');
    }

    // ===== МАТЧИ =====
    function renderMatchesList() {
        const container = document.getElementById('matchList');
        const keys = Object.keys(matchData).sort((a, b) => new Date(matchData[b].date) - new Date(matchData[a].date));
        
        container.innerHTML = keys.map(id => {
            const m = matchData[id];
            const isLoss = m.loser.includes('Team 1');
            return `
                <div class="match-card ${isLoss ? 'loss' : ''}" onclick="location.href='match.html?id=${id}'">
                    <div class="match-top">
                        <span class="title">${m.title}</span>
                        <span class="date">${m.date} · ${m.score}</span>
                    </div>
                    <div class="match-teams">
                        <div class="team win"><span class="name">${m.winner}</span><span class="score">${m.score.split(':')[0]}</span></div>
                        <span class="vs">vs</span>
                        <div class="team loss"><span class="score">${m.score.split(':')[1]}</span><span class="name">${m.loser}</span></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (Игроки / Команды) =====
    function switchLeftTab(tab) {
        document.getElementById('tabPlayersBtn').classList.toggle('active', tab === 'players');
        document.getElementById('tabTeamsBtn').classList.toggle('active', tab === 'teams');
        document.getElementById('leftContentPlayers').style.display = tab === 'players' ? 'block' : 'none';
        document.getElementById('leftContentTeams').style.display = tab === 'teams' ? 'block' : 'none';
        
        if (tab === 'teams') renderTeamsList();
    }

    // ===== РЕНДЕР КОМАНД =====
    function renderTeamsList() {
        const container = document.getElementById('teamListContainer');
        const teams = [
            { id: 'tf2', name: 'Team Fortress 2', w: 2, l: 0, status: 'Победа', isWin: true },
            { id: 'magic', name: 'Team Magic', w: 0, l: 2, status: 'Поражение', isWin: false }
        ];

        container.innerHTML = teams.map((t, i) => `
            <div class="team-card ${t.isWin ? 'win' : 'loss'}" onclick="location.href='team.html?id=${t.id}'">
                <div style="font-family:var(--mono); font-size:18px; font-weight:800; color:var(--muted);">#${i+1}</div>
                <div style="flex:1;">
                    <div style="font-weight:700; font-size:14px; color:var(--text);">${t.name}</div>
                    <div style="font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px;">${t.status}</div>
                </div>
                <div style="font-family:var(--mono); font-size:16px; font-weight:800; color:${t.isWin ? 'var(--success)' : 'var(--danger)'};">
                    ${t.w} : ${t.l}
                </div>
            </div>
        `).join('');
    }

    // ===== ТОП ИГРОКОВ (ПОДИУМ) =====
    let currentTop = 'rating';
    let currentMonth = 'all';

    function getAvailableMonths() {
        const months = {};
        const monthNames = { '5': 'Май', '6': 'Июнь', '7': 'Июль', '8': 'Август', '9': 'Сентябрь' };
        Object.keys(matchData).forEach(key => {
            const match = matchData[key];
            if (!match || !match.date) return;
            const dateParts = match.date.split('.');
            if (dateParts.length === 3) {
                const month = parseInt(dateParts[1]);
                if (!months[month]) months[month] = { count: 0, name: monthNames[month] || month };
                months[month].count++;
            }
        });
        return months;
    }

    function renderMonthFilter() {
        const container = document.getElementById('monthFilter');
        const months = getAvailableMonths();
        const sortedMonths = Object.keys(months).sort((a, b) => parseInt(a) - parseInt(b));

        let html = `<button class="month-btn active" onclick="setMonth('all')" data-month="all">📅 Всё время</button>`;
        sortedMonths.forEach(month => {
            html += `<button class="month-btn" onclick="setMonth('${month}')" data-month="${month}">${months[month].name} <span class="count">(${months[month].count})</span></button>`;
        });
        container.innerHTML = html;
    }

    function setMonth(month) {
        currentMonth = month;
        document.querySelectorAll('.month-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.month === month));
        const monthNames = { 'all': 'всё время', '5': 'май', '6': 'июнь', '7': 'июль', '8': 'август', '9': 'сентябрь' };
        document.getElementById('monthInfo').textContent = `за ${monthNames[month] || 'всё время'}`;
        renderTopPlayers(currentTop);
    }

    function getPlayersForMonth(month) {
        if (month === 'all') return playersData;
        const matchKeys = Object.keys(matchData).filter(key => {
            const match = matchData[key];
            if (!match || !match.date) return false;
            return parseInt(match.date.split('.')[1]) === parseInt(month);
        });
        if (matchKeys.length === 0) return [];

        return playersData.map(p => {
            const copy = { ...p, k: 0, d: 0, a: 0, matches: 0, kd: 0, adr: 0, diff: 0, rating: 0 };
            matchKeys.forEach(matchKey => {
                const match = matchData[matchKey];
                ['win', 'loss'].forEach(side => {
                    const team = match.teams?.[side] || match.total?.teams?.[side];
                    if (!team) return;
                    const player = team.players.find(p2 => p2.name === p.name);
                    if (player) {
                        copy.k += player.k || 0; copy.d += player.d || 0; copy.a += player.a || 0;
                        copy.diff += player.diff || 0; copy.matches++; copy.adr += player.adr || 0;
                        copy.rating += player.rating || p.rating || 0;
                    }
                });
            });
            if (copy.matches > 0) {
                copy.kd = copy.k / (copy.d || 1) || 0;
                copy.adr = Math.round(copy.adr / copy.matches);
                copy.rating = parseFloat((copy.rating / copy.matches).toFixed(2));
            }
            return copy;
        }).filter(p => p.matches > 0);
    }

    function switchTop(type) {
        currentTop = type;
        document.getElementById('subKd').className = type === 'kd' ? 'sub-nav-btn active' : 'sub-nav-btn';
        document.getElementById('subRating').className = type === 'rating' ? 'sub-nav-btn active' : 'sub-nav-btn';
        renderTopPlayers(type);
    }

    function renderTopPlayers(type) {
        const data = getPlayersForMonth(currentMonth);
        if (!data || !data.length) {
            document.getElementById('podiumContainer').innerHTML = '';
            document.getElementById('playerList').innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:12px;">Нет данных</div>';
            return;
        }

        const sorted = type === 'kd' ?
            [...data].filter(p => p.kd > 0).sort((a, b) => b.kd - a.kd) :
            [...data].filter(p => p.rating > 0).sort((a, b) => b.rating - a.rating);

        if (sorted.length === 0) return;

        const podiumContainer = document.getElementById('podiumContainer');
        const first = sorted[0]; const second = sorted[1]; const third = sorted[2];

        const createPodiumCard = (player, placeClass, placeNumber) => {
            if (!player) return '';
            const displayVal = type === 'kd' ? player.kd.toFixed(2) : player.rating.toFixed(2);
            return `
                <div class="podium-item ${placeClass}" onclick="location.href='player.html?name=${encodeURIComponent(player.name)}'">
                    <div class="podium-avatar">${player.avatar ? `<img src="${player.avatar}">` : player.name.charAt(0).toUpperCase()}</div>
                    <div class="podium-name">${player.name.split(' ')[0]}</div>
                    <div class="podium-stat">${displayVal}</div>
                    <div class="podium-bar">${placeNumber}</div>
                </div>
            `;
        };

        let podiumHTML = '';
        if (second) podiumHTML += createPodiumCard(second, 'second', '2');
        if (first)  podiumHTML += createPodiumCard(first, 'first', '1');
        if (third)  podiumHTML += createPodiumCard(third, 'third', '3');
        podiumContainer.innerHTML = podiumHTML;

        const container = document.getElementById('playerList');
        const rest = sorted.slice(3);
        if (rest.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:var(--dim);padding:10px;font-size:10px;">Больше игроков нет</div>';
        } else {
            container.innerHTML = rest.map((p, i) => {
                const displayVal = type === 'kd' ? p.kd : p.rating;
                return `
                <div class="player-row" onclick="location.href='player.html?name=${encodeURIComponent(p.name)}'" style="border-bottom:none; padding:6px 8px;">
                    <span class="rank">#${i+4}</span>
                    <div class="player-avatar-mini">${p.avatar ? `<img src="${p.avatar}" alt="${p.name}">` : p.name.charAt(0).toUpperCase()}</div>
                    <span class="pname ${p.you ? 'you' : ''}">${p.name}</span>
                    <span class="badge-kd">${displayVal.toFixed(2)}</span>
                </div>
            `}).join('');
        }

        document.getElementById('topFooterName').textContent = first?.name || '—';
        document.getElementById('topFooterText').textContent = type === 'kd' ? 'лидер по K/D' : 'лидер по рейтингу';
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }

    // ИНИЦИАЛИЗАЦИЯ
    renderNews();
    renderMatchesList();
    renderMonthFilter();
    renderTopPlayers('rating');
</script>
</body>
</html>
