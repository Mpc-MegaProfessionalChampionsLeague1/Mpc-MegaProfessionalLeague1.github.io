    // ===== ДОСТИЖЕНИЯ =====
    function getAchievements(player) {
        const ach = [];
        if (player.kd > 1.5) ach.push({ icon: '🥇', name: 'Элитный K/D' });
        if (player.kd > 2.0) ach.push({ icon: '💎', name: 'Легендарный K/D' });
        if (player.diff > 100) ach.push({ icon: '⚡', name: 'Доминатор' });
        if (player.diff > 50 && player.diff <= 100) ach.push({ icon: '🔥', name: 'Кипящий' });
        if (player.adr > 90) ach.push({ icon: '💥', name: 'Урон-машина' });
        if (player.matches >= 4) ach.push({ icon: '🏅', name: 'Ветеран' });
        if (player.name === 'bomba69') ach.push({ icon: '⭐', name: 'MVP турнира' });
        if (player.name === 'Хомяк с авт' && player.diff === 116) ach.push({ icon: '🏆', name: 'Лучшая разница' });
        return ach;
    }

    // ===== ТОКЕН =====
    let githubToken = localStorage.getItem('mpl_github_token') || '';

    function saveToken() {
        const input = document.getElementById('tokenInput');
        const token = input.value.trim();
        if (!token) {
            document.getElementById('tokenStatus').textContent = '❌ Введите токен!';
            document.getElementById('tokenStatus').className = 'token-status error';
            return;
        }
        localStorage.setItem('mpl_github_token', token);
        githubToken = token;
        document.getElementById('tokenStatus').textContent = '✅ Токен сохранён, загрузка...';
        document.getElementById('tokenStatus').className = 'token-status success';
        document.getElementById('tokenSetup').classList.remove('show');
        loadAvatarsFromGitHub();
    }

    // ===== ЗАГРУЗКА АВАТАРОК (С ПРАВИЛЬНЫМ ПУТЁМ) =====
    async function loadAvatarsFromGitHub() {
        if (!githubToken || githubToken === '') {
            document.getElementById('tokenStatus').textContent = '⏳ Токен не сохранён';
            document.getElementById('tokenStatus').className = 'token-status';
            document.getElementById('tokenSetup').classList.add('show');
            renderPlayers();
            return;
        }

        try {
            // ✅ ПРАВИЛЬНЫЙ ПУТЬ К РЕПОЗИТОРИЮ
            const url = `https://api.github.com/repos/Mpc-MegaProfessionalChampionsLeague1/Mpc-MegaProfessionalLeague1.github.io/contents/avatars`;
            
            const response = await fetch(url, {
                headers: {
                    'Authorization': `token ${githubToken}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (response.ok) {
                const files = await response.json();
                let loaded = 0;
                files.forEach(file => {
                    if (file.name.endsWith('.png') || file.name.endsWith('.jpg') || file.name.endsWith('.jpeg')) {
                        const playerName = file.name.replace(/\.[^/.]+$/, '');
                        const avatarUrl = file.download_url;
                        const player = playersData.find(p => p.name === playerName);
                        if (player) {
                            player.avatar = avatarUrl;
                            loaded++;
                        }
                    }
                });
                document.getElementById('tokenStatus').textContent = `✅ Загружено ${loaded} аватарок`;
                document.getElementById('tokenStatus').className = 'token-status success';
                document.getElementById('tokenSetup').classList.remove('show');
            } else if (response.status === 404) {
                document.getElementById('tokenStatus').textContent = '⚠️ Папка avatars не найдена. Создайте её в репозитории!';
                document.getElementById('tokenStatus').className = 'token-status error';
            } else {
                const errorData = await response.json();
                document.getElementById('tokenStatus').textContent = `❌ Ошибка ${response.status}: ${errorData.message || 'неизвестная ошибка'}`;
                document.getElementById('tokenStatus').className = 'token-status error';
            }
        } catch(e) {
            document.getElementById('tokenStatus').textContent = '❌ Ошибка подключения: ' + e.message;
            document.getElementById('tokenStatus').className = 'token-status error';
        }
        renderPlayers();
    }

    // ===== СОХРАНЕНИЕ АВАТАРКИ (С ПРАВИЛЬНЫМ ПУТЁМ) =====
    async function saveAvatarToGitHub(playerName, dataUrl) {
        if (!githubToken || githubToken === '') {
            alert('❌ Сначала сохраните GitHub токен!');
            document.getElementById('tokenSetup').classList.add('show');
            return;
        }

        try {
            const response = await fetch(dataUrl);
            const blob = await response.blob();
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async function() {
                const base64 = reader.result.split(',')[1];
                const fileName = `${playerName}.png`;
                // ✅ ПРАВИЛЬНЫЙ ПУТЬ К РЕПОЗИТОРИЮ
                const url = `https://api.github.com/repos/Mpc-MegaProfessionalChampionsLeague1/Mpc-MegaProfessionalLeague1.github.io/contents/avatars/${fileName}`;

                let sha = '';
                try {
                    const checkResponse = await fetch(url, {
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                    }
                } catch(e) {}

                const body = {
                    message: `Обновление аватарки для ${playerName}`,
                    content: base64,
                    branch: 'main'
                };
                if (sha) body.sha = sha;

                const uploadResponse = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (uploadResponse.ok) {
                    const result = await uploadResponse.json();
                    const player = playersData.find(p => p.name === playerName);
                    if (player) {
                        player.avatar = result.content.download_url;
                        renderPlayers();
                        openProfile(playerName);
                    }
                    alert('✅ Аватарка успешно загружена!');
                } else {
                    const err = await uploadResponse.json();
                    alert('❌ Ошибка загрузки: ' + (err.message || 'неизвестная ошибка'));
                }
            };
        } catch(e) {
            alert('❌ Ошибка: ' + e.message);
        }
    }

    // ===== ПРОФИЛЬ =====

        const achievements = getAchievements(player);

        const content = document.getElementById('profileContent');
        content.innerHTML = `
            <div class="profile-header">
                <div class="profile-avatar-container">
                    <div class="profile-avatar">
                        ${player.avatar ? `<img src="${player.avatar}" alt="${playerName}">` : playerName.charAt(0).toUpperCase()}
                    </div>
                    <label class="profile-avatar-upload" title="Загрузить аватар">
                        📷
                        <input type="file" accept="image/*" onchange="uploadAvatar('${playerName}', this)">
                    </label>
                </div>
                <div class="profile-header-info">
                    <h2>${playerName} ${player.you ? '⭐' : ''}</h2>
                    <div class="sub">
                        ${player.matches} матчей · ${player.k} убийств · ${player.d} смертей
                        ${player.you ? ' · <b style="color:#a29bfe;">Это вы!</b>' : ''}
                    </div>
                </div>
            </div>
            <div class="profile-stats">
                <div class="profile-stat"><div class="num">${player.kd.toFixed(2)}</div><div class="label">K/D</div></div>
                <div class="profile-stat"><div class="num">${player.adr}</div><div class="label">ADR</div></div>
                <div class="profile-stat"><div class="num ${player.diff > 0 ? 'good' : 'bad'}">${player.diff > 0 ? '+' : ''}${player.diff}</div><div class="label">Разница</div></div>
                <div class="profile-stat"><div class="num">${player.rating.toFixed(2)}</div><div class="label">Рейтинг</div></div>
            </div>
            ${achievements.length > 0 ? `<div class="profile-achievements">${achievements.map(a => `<div class="profile-achievement"><span class="ach-icon">${a.icon}</span><span class="ach-name">${a.name}</span></div>`).join('')}</div>` : `<div style="font-size:12px; color:#6e7f94; margin-bottom:12px;">Нет достижений</div>`}
            <div class="profile-matches-title">📋 История матчей</div>
            ${history.length > 0 ? history.map(m => `<div class="profile-match-row"><span class="match-name">${m.match} — ${m.map}</span><span class="match-stats">${m.k} - ${m.d} <span class="${m.diff > 0 ? 'good' : 'bad'}">${m.diff > 0 ? '+' : ''}${m.diff}</span></span></div>`).join('') : '<div style="font-size:12px; color:#6e7f94;">Нет данных о матчах</div>'}
        `;

        document.getElementById('profileOverlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function uploadAvatar(playerName, input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            saveAvatarToGitHub(playerName, e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function closeProfile() {
        document.getElementById('profileOverlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    // ===== РЕНДЕР ТОП ИГРОКОВ =====
    function renderPlayers() {
        const container = document.getElementById('playerList');
        const sorted = [...playersData].sort((a, b) => b.kd - a.kd);
        const ranks = ['gold', 'silver', 'bronze', '', '', '', '', '', '', ''];
        container.innerHTML = sorted.map((p, i) => `
            <div class="top-player-row" onclick="openProfile('${p.name}')">
                <span class="rank ${ranks[i] || ''}">#${i+1}</span>
                <div class="player-avatar-mini">
                    ${p.avatar ? `<img src="${p.avatar}" alt="${p.name}">` : p.name.charAt(0).toUpperCase()}
                </div>
                <span class="pname ${p.you ? 'you' : ''}">${p.name}</span>
                <span class="badge-kd ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : i === sorted.length - 1 ? 'red' : ''}">${p.kd.toFixed(2)}</span>
                <span class="pstats"><b class="${p.diff > 0 ? 'best' : 'worst'}">${p.diff > 0 ? '+' : ''}${p.diff}</b></span>
            </div>
        `).join('');
    }

    // ===== НОВОСТИ =====
    let newsData = JSON.parse(localStorage.getItem('mpl_news')) || [
        { id: 1, title: '🏆 Старт сезона MPL!', text: 'Дружеский турнир MPL начался!', date: new Date('2026-05-09T10:00:00').toISOString(), comments: [{ author: 'bomba69', text: '🔥 Погнали!', time: Date.now() - 3600000 }] },
        { id: 2, title: '🔥 Bomba69 делает 24-4!', text: 'В матче #2 Bomba69 показал невероятный результат!', date: new Date('2026-05-09T15:30:00').toISOString(), comments: [{ author: 'Хомяк с авт', text: 'Красава!', time: Date.now() - 1800000 }] },
        { id: 3, title: '🖼️ Аватарки теперь общие!', text: 'Введите GitHub токен и загружайте аватарки — они будут видны всем!', date: new Date().toISOString(), comments: [] }
    ];

    function saveNews() {
        localStorage.setItem('mpl_news', JSON.stringify(newsData));
    }

    function renderNews() {
        const container = document.getElementById('newsList');
        const sorted = [...newsData].sort((a, b) => new Date(b.date) - new Date(a.date));
        container.innerHTML = sorted.map(n => `
            <div class="news-item">
                <div class="news-header">
                    <span class="news-title">${n.title}</span>
                    <span class="news-date">${new Date(n.date).toLocaleString('ru-RU')}</span>
                    <button class="news-delete" onclick="deleteNews(${n.id})">✕</button>
                </div>
                <div class="news-text">${n.text}</div>
                <div class="comment-section">
                    <div class="comment-title">💬 Комментарии (${(n.comments || []).length})</div>
                    <div class="comment-input">
                        <input type="text" id="commentInput_${n.id}" placeholder="Ваш комментарий..." onkeydown="if(event.key==='Enter') addComment(${n.id})">
                        <button onclick="addComment(${n.id})">Отправить</button>
                    </div>
                    ${(n.comments || []).slice().reverse().map(c => `
                        <div class="comment-item">
                            <span class="comment-author">${c.author}</span>
                            <span class="comment-text">${c.text}</span>
                            <span class="comment-time">${new Date(c.time).toLocaleTimeString()}</span>
                            <button class="comment-delete" onclick="deleteComment(${n.id}, '${c.author}', ${c.time})">✕</button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function publishNews() {
        const title = document.getElementById('newsTitleInput').value.trim();
        const text = document.getElementById('newsTextInput').value.trim();
        if (!title || !text) { alert('Заполните заголовок и текст!'); return; }
        newsData.push({ id: Date.now(), title, text, date: new Date().toISOString(), comments: [] });
        saveNews();
        document.getElementById('newsTitleInput').value = '';
        document.getElementById('newsTextInput').value = '';
        renderNews();
    }

    function deleteNews(id) {
        newsData = newsData.filter(n => n.id !== id);
        saveNews();
        renderNews();
    }

    function addComment(newsId) {
        const input = document.getElementById(`commentInput_${newsId}`);
        const text = input.value.trim();
        if (!text) return;
        const news = newsData.find(n => n.id === newsId);
        if (!news) return;
        if (!news.comments) news.comments = [];
        const author = prompt('Ваш ник:', 'Игрок') || 'Аноним';
        news.comments.push({ author, text, time: Date.now() });
        saveNews();
        renderNews();
        input.value = '';
    }

    function deleteComment(newsId, author, time) {
        if (!confirm(`Удалить комментарий от ${author}?`)) return;
        const news = newsData.find(n => n.id === newsId);
        if (!news) return;
        news.comments = news.comments.filter(c => !(c.author === author && c.time === time));
        saveNews();
        renderNews();
    }

    // ===== ГРАФИКИ =====
    function renderCharts() {
        const chartContainer = document.getElementById('kdChartBars');
        const sorted = [...playersData].sort((a, b) => b.kd - a.kd);
        const maxKd = sorted[0].kd;

        chartContainer.innerHTML = sorted.map(p => {
            const height = Math.max((p.kd / maxKd) * 100, 8);
            const barClass = p.kd > 1.2 ? 'kd-bar good' : p.kd < 0.7 ? 'kd-bar bad' : 'kd-bar';
            return `
                <div class="chart-bar-wrapper">
                    <div class="bar-value">${p.kd.toFixed(2)}</div>
                    <div class="chart-bar ${barClass}" style="height: ${height}%;"></div>
                    <div class="bar-label">${p.name.length > 10 ? p.name.slice(0, 8) + '…' : p.name}</div>
                </div>
            `;
        }).join('');

        const maxKdAll = Math.max(...playersData.map(p => p.kd));
        const maxAdr = Math.max(...playersData.map(p => p.adr));
        const maxDiff = Math.max(...playersData.map(p => Math.abs(p.diff)));
        const maxRating = Math.max(...playersData.map(p => p.rating));

        ['kdChart', 'adrChart', 'diffChart', 'ratingChart'].forEach(id => document.getElementById(id).innerHTML = '');

        document.getElementById('kdChart').innerHTML = [...playersData].sort((a,b) => b.kd - a.kd).map(p => `
            <div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11px;">
                <span style="min-width:80px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:14px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${p.kd/maxKdAll*100}%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:3px;"></div>
                </div>
                <span style="min-width:36px;font-weight:600;">${p.kd.toFixed(2)}</span>
            </div>
        `).join('');

        document.getElementById('adrChart').innerHTML = [...playersData].sort((a,b) => b.adr - a.adr).map(p => `
            <div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11px;">
                <span style="min-width:80px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:14px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${p.adr/maxAdr*100}%;background:linear-gradient(90deg,#00b894,#00cec9);border-radius:3px;"></div>
                </div>
                <span style="min-width:36px;font-weight:600;">${p.adr}</span>
            </div>
        `).join('');

        document.getElementById('diffChart').innerHTML = [...playersData].sort((a,b) => b.diff - a.diff).map(p => `
            <div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11px;">
                <span style="min-width:80px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:14px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${Math.abs(p.diff)/maxDiff*100}%;background:${p.diff>=0?'linear-gradient(90deg,#00b894,#00cec9)':'linear-gradient(90deg,#e17055,#d63031)'};border-radius:3px;"></div>
                </div>
                <span style="min-width:36px;font-weight:600;">${p.diff > 0 ? '+' : ''}${p.diff}</span>
            </div>
        `).join('');

        document.getElementById('ratingChart').innerHTML = [...playersData].sort((a,b) => b.rating - a.rating).map(p => `
            <div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11px;">
                <span style="min-width:80px;text-align:right;color:#8b9bb0;">${p.name}</span>
                <div style="flex:1;height:14px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
                    <div style="height:100%;width:${p.rating/maxRating*100}%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:3px;"></div>
                </div>
                <span style="min-width:36px;font-weight:600;">${p.rating.toFixed(2)}</span>
            </div>
        `).join('');
    }

    // ===== ТЕМА =====
    function toggleTheme() {
        document.body.classList.toggle('light');
        document.querySelector('.theme-toggle').textContent = document.body.classList.contains('light') ? '🌙' : '🌙';
    }

    // ===== ЯЗЫК =====
    let lang = 'ru';
    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.querySelector('.lang-toggle').textContent = lang === 'ru' ? '🇬🇧 EN' : '🇷🇺 RU';
    }

    // ===== PWA =====
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').classList.add('show');
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                document.getElementById('installBtn').classList.remove('show');
                deferredPrompt = null;
            });
        }
    }

    // ===== НАВИГАЦИЯ =====
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'tab-charts') renderCharts();
        });
    });

    // ===== ДЕТАЛИ МАТЧА =====
    function toggleMatchDetail(card) {
        const detail = card.querySelector('.match-detail');
        if (detail) {
            detail.classList.toggle('open');
            const hint = card.querySelector('.click-hint');
            if (hint) hint.textContent = detail.classList.contains('open') ? '▼' : '▶';
        }
    }

    // ===== ЗАКРЫТИЕ ПРОФИЛЯ =====
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeProfile(); });
    document.getElementById('profileOverlay').addEventListener('click', (e) => { if (e.target === this) closeProfile(); });

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    if (githubToken) {
        document.getElementById('tokenInput').value = githubToken;
        document.getElementById('tokenStatus').textContent = '⏳ Загрузка аватарок...';
        document.getElementById('tokenStatus').className = 'token-status';
        loadAvatarsFromGitHub();
    } else {
        document.getElementById('tokenSetup').classList.add('show');
    }

    renderPlayers();
    renderNews();
    renderCharts();
</script>

</body>
</html>
