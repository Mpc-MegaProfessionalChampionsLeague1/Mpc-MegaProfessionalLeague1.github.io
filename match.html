<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Детали матча</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .match-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }
        .match-page-title {
            font-size: 24px;
            font-weight: 700;
            color: #e8eff7;
        }
        .match-page-date {
            color: #6e7f94;
            font-size: 13px;
        }
        .match-page-result {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 14px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .match-page-result .result-team {
            font-size: 16px;
            font-weight: 600;
        }
        .match-page-result .result-team.win {
            color: #7ddfa0;
        }
        .match-page-result .result-team.loss {
            color: #e07a7a;
        }
        .match-page-result .result-score {
            font-size: 28px;
            font-weight: 800;
            color: #e8eff7;
        }
        .match-page-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #8b9bb0;
            margin-bottom: 10px;
            margin-top: 16px;
            letter-spacing: 0.3px;
        }
        .match-page-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 700px) {
            .match-page-grid {
                grid-template-columns: 1fr;
            }
        }
        .match-page-team {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .match-page-team .team-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .match-page-team .team-title.win {
            color: #7ddfa0;
        }
        .match-page-team .team-title.loss {
            color: #e07a7a;
        }
        .match-page-player {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .match-page-player:last-child {
            border-bottom: none;
        }
        .match-page-player .pname {
            color: #b0c4de;
        }
        .match-page-player .pname.highlight {
            color: #ffb347;
            font-weight: 600;
        }
        .match-page-player .pname.worst {
            color: #e07a7a;
        }
        .match-page-player .pstats {
            color: #6e7f94;
            font-size: 11px;
        }
        .match-page-player .pstats .kills {
            color: #7ddfa0;
        }
        .match-page-player .pstats .deaths {
            color: #e07a7a;
        }
        .match-page-footer {
            font-size: 12px;
            color: #4a5a6e;
            text-align: center;
            padding-top: 14px;
            margin-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .back-btn {
            display: inline-block;
            color: #6e7f94;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #ffb347;
        }

        /* Для BO3 с тремя секциями */
        .bo3-section {
            margin-bottom: 16px;
        }
        .bo3-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #8b9bb0;
            margin-bottom: 8px;
        }
        .bo3-section .section-label .map-score {
            color: #e8eff7;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1>
        </div>
        <div class="header-right">
            <span>📅 Май-Июль 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">🇬🇧 EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
        <a href="index.html" class="nav-btn">📊 Главная</a>
        <a href="matches.html" class="nav-btn active">📋 Матчи</a>
        <a href="players.html" class="nav-btn">👥 Игроки</a>
        <a href="stats.html" class="nav-btn">📈 Статистика</a>
        <a href="about.html" class="nav-btn">ℹ️ О сайте</a>
    </nav>

    <!-- MATCH CONTENT -->
    <div id="matchContent">
        <!-- Рендерится через JS -->
    </div>

    <!-- FOOTER -->
    <div class="footer">
        MPL · Mega Professional League · <b>HLTV-style</b> · Май-Июль 2026
    </div>

</div>

<script src="js/data.js"></script>
<script>
    // ===== ПОЛУЧАЕМ ID МАТЧА ИЗ URL =====
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');

    // ===== ФУНКЦИЯ ДЛЯ СОЗДАНИЯ СТАТИСТИКИ КОМАНДЫ =====
    function renderTeamStats(players, isWin) {
        return players.map(p => {
            let nameClass = 'pname';
            if (p.highlight) nameClass += ' highlight';
            if (p.worst) nameClass += ' worst';
            let stats = '';
            if (p.k !== undefined && p.d !== undefined) {
                stats = `<span class="kills">${p.k}</span> - <span class="deaths">${p.d}</span> · ADR ${p.adr}`;
                if (p.a !== undefined) stats += ` · A: ${p.a}`;
            } else if (p.rating !== undefined) {
                stats = `рейтинг ${p.rating.toFixed(2)}`;
            }
            return `
                <div class="match-page-player">
                    <span class="${nameClass}">${p.name}</span>
                    <span class="pstats">${stats}</span>
                </div>
            `;
        }).join('');
    }

    // ===== РЕНДЕР СТРАНИЦЫ МАТЧА =====
    function renderMatchPage(id) {
        const container = document.getElementById('matchContent');
        
        if (!id) {
            container.innerHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div style="font-size:48px;margin-bottom:16px;">👀</div>
                    <div style="font-size:20px;font-weight:700;color:#e8eff7;">Матч не выбран</div>
                    <div style="color:#6e7f94;margin-top:8px;">Вернитесь на страницу <a href="matches.html" style="color:#ffb347;">списка матчей</a></div>
                </div>
            `;
            return;
        }

        const data = matchData[id];
        if (!data) {
            container.innerHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div style="font-size:48px;margin-bottom:16px;">❌</div>
                    <div style="font-size:20px;font-weight:700;color:#e8eff7;">Матч не найден</div>
                    <div style="color:#6e7f94;margin-top:8px;">Вернитесь на страницу <a href="matches.html" style="color:#ffb347;">списка матчей</a></div>
                </div>
            `;
            return;
        }

        // Проверяем, BO3 это или BO1
        const isBo3 = id === 'match0';

        let html = `
            <a href="matches.html" class="back-btn">← Назад к списку матчей</a>

            <div class="match-page-header">
                <span class="match-page-title">${data.title}</span>
                <span class="match-page-date">${data.date} · ${data.map}</span>
            </div>

            <div class="match-page-result">
                <span class="result-team win">${data.winner}</span>
                <span class="result-score">${data.score}</span>
                <span class="result-team loss">${data.loser}</span>
            </div>
        `;

        if (isBo3) {
            // === BO3 ===
            // Карта 1: Ancient
            html += `
                <div class="bo3-section">
                    <div class="section-label">📊 Карта 1: ${data.map1.name} <span class="map-score">(${data.map1.score})</span></div>
                    <div class="match-page-grid">
                        <div class="match-page-team">
                            <div class="team-title win">✅ ${data.map1.teams.win.name}</div>
                            ${renderTeamStats(data.map1.teams.win.players, true)}
                        </div>
                        <div class="match-page-team">
                            <div class="team-title loss">❌ ${data.map1.teams.loss.name}</div>
                            ${renderTeamStats(data.map1.teams.loss.players, false)}
                        </div>
                    </div>
                </div>
            `;

            // Карта 2: Anubis
            html += `
                <div class="bo3-section">
                    <div class="section-label">📊 Карта 2: ${data.map2.name} <span class="map-score">(${data.map2.score})</span></div>
                    <div class="match-page-grid">
                        <div class="match-page-team">
                            <div class="team-title win">✅ ${data.map2.teams.win.name}</div>
                            ${renderTeamStats(data.map2.teams.win.players, true)}
                        </div>
                        <div class="match-page-team">
                            <div class="team-title loss">❌ ${data.map2.teams.loss.name}</div>
                            ${renderTeamStats(data.map2.teams.loss.players, false)}
                        </div>
                    </div>
                </div>
            `;

            // Общая статистика
            html += `
                <div class="match-page-section-title" style="border-top:2px solid rgba(255,255,255,0.1);padding-top:14px;margin-top:4px;">📊 ОБЩАЯ СТАТИСТИКА (Ancient + Anubis)</div>
                <div class="match-page-grid">
                    <div class="match-page-team">
                        <div class="team-title win">✅ ${data.total.teams.win.name}</div>
                        ${renderTeamStats(data.total.teams.win.players, true)}
                    </div>
                    <div class="match-page-team">
                        <div class="team-title loss">❌ ${data.total.teams.loss.name}</div>
                        ${renderTeamStats(data.total.teams.loss.players, false)}
                    </div>
                </div>
                <div class="match-page-footer">🎯 BO3 · Победа 2:0</div>
            `;
        } else {
            // === BO1 ===
            // Проверяем, есть ли данные с рейтингом или с K/D
            const hasKd = data.teams.win.players[0] && data.teams.win.players[0].k !== undefined;

            html += `
                <div class="match-page-section-title">📊 Подробная статистика</div>
                <div class="match-page-grid">
                    <div class="match-page-team">
                        <div class="team-title win">✅ ${data.teams.win.name}</div>
                        ${renderTeamStats(data.teams.win.players, true)}
                    </div>
                    <div class="match-page-team">
                        <div class="team-title loss">❌ ${data.teams.loss.name}</div>
                        ${renderTeamStats(data.teams.loss.players, false)}
                    </div>
                </div>
                <div class="match-page-footer">🎯 ${data.detail}</div>
            `;
        }

        container.innerHTML = html;
    }

    // ===== ТЕМА =====
    function toggleTheme() {
        document.body.classList.toggle('light');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '🌙' : '🌙';
    }

    let lang = 'ru';

    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('langBtn').textContent = lang === 'ru' ? '🇬🇧 EN' : '🇷🇺 RU';
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    renderMatchPage(matchId);
</script>

</body>
</html>
