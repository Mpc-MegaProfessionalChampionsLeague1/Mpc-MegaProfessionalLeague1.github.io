<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Матч</title>
    <meta name="description" content="Детальная статистика матча MPL.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text x='50' y='78' font-size='80' text-anchor='middle' fill='%23c8ff00' font-family='monospace' font-weight='bold'>+</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=51">
    <style>
        .match-header { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
        .match-team-info { display: flex; align-items: center; gap: 16px; flex: 1; }
        .match-team-logo { width: 64px; height: 64px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 28px; font-weight: 800; color: var(--muted); }
        .match-team-name { font-family: var(--mono); font-size: 24px; font-weight: 800; color: var(--text); }
        .match-center { text-align: center; min-width: 120px; }
        .match-score { font-family: var(--mono); font-size: 40px; font-weight: 800; color: var(--accent); line-height: 1; }
        .match-date-center { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--mono); text-transform: uppercase; }
        .match-status-badge { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-top: 4px; display: block; }

        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .match-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
        .match-box-title { font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: var(--muted); }
        .info-row .value { color: var(--text); font-weight: 600; font-family: var(--mono); }

        .map-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .map-row:last-child { border-bottom: none; }
        .map-name { color: var(--text); font-weight: 600; }
        .map-score { color: var(--accent); font-weight: 800; }

        .player-table { width: 100%; border-collapse: collapse; }
        .player-table th { text-align: left; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--border); }
        .player-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 13px; color: var(--text); }
        .player-table tr:hover td { background: var(--surface-2); }
        .player-table .flag { margin-right: 6px; }
        .team-title-header { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .team-title-header img { width: 24px; height: 24px; object-fit: contain; }

        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body class="theme-terminal">
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;">
            <div style="display:flex; align-items:flex-start; gap:2px;">
                <svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="-2">MPL</text>
                    <g transform="translate(67, 10)">
                        <rect x="6" y="0" width="4" height="16" fill="var(--accent)" />
                        <rect x="0" y="6" width="16" height="4" fill="var(--accent)" />
                    </g>
                </svg>
            </div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:9px; color:#00d2ff; letter-spacing: 3px; margin-top:-6px; margin-left: 2px;">FRIENDLY MATCHES</div>
        </div>

        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div>
                    <select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;">
                        <option value="theme-terminal">Terminal (Зеленая)</option>
                        <option value="theme-cyberpunk">Cyberpunk (Розовая)</option>
                        <option value="theme-ocean">Ocean (Синяя)</option>
                        <option value="theme-blood">Blood Moon (Красная)</option>
                        <option value="theme-matrix">Matrix (Черно-зеленая)</option>
                    </select>
                </div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <div style="margin: 20px 0;">
        <a href="matches.html" class="back-btn">← Назад ко всем матчам</a>
    </div>

    <div id="matchContent"></div>

    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    // ТЕМЫ
    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }
    function changeTheme(themeName) { localStorage.setItem('mpl_theme', themeName); document.body.className = themeName; location.reload(); }
    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    document.getElementById('bgUpload').addEventListener('change', function(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); } });
    window.addEventListener('DOMContentLoaded', () => { const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal'; document.body.className = savedTheme; const select = document.getElementById('themeSelect'); if (select) select.value = savedTheme; const savedBg = localStorage.getItem('mpl_bg'); if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; } });

    // ЛОГИКА СТРАНИЦЫ МАТЧА
    const urlParams = new URLSearchParams(window.location.search);
    const upcoming = urlParams.get('upcoming');
    const matchId = urlParams.get('id');
    const container = document.getElementById('matchContent');
    
    const flagSVG = `<svg viewBox="0 0 100 70" style="width:18px; height:12px; border-radius:2px; display:inline-block; vertical-align:middle;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;
    const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`;

    if (upcoming === 'true') {
        // РЕНДЕР БУДУЩЕГО МАТЧА (TBD)
        const format = urlParams.get('format') || 'TBD';
        const tour = urlParams.get('tour') || 'TBD';
        const date = urlParams.get('date') || 'TBD';

        container.innerHTML = `
            <!-- ШАПКА МАТЧА -->
            <div class="match-header">
                <div class="match-team-info">
                    <div class="match-team-logo">?</div>
                    <div class="match-team-name">TBD</div>
                </div>
                
                <div class="match-center">
                    <div class="match-score">TBD</div>
                    <div class="match-date-center">${date}</div>
                    <span class="match-status-badge">MATCH UPCOMING</span>
                </div>

                <div class="match-team-info" style="justify-content: flex-end;">
                    <div class="match-team-name">TBD</div>
                    <div class="match-team-logo">?</div>
                </div>
            </div>

            <!-- ИНФО И КАРТЫ -->
            <div class="match-grid">
                <div class="match-box">
                    <div class="match-box-title">Карты</div>
                    <div class="map-row"><span class="map-name">Карта 1</span><span class="map-score">TBD</span></div>
                    <div class="map-row"><span class="map-name">Карта 2</span><span class="map-score">TBD</span></div>
                    ${format === 'BO3' ? `<div class="map-row"><span class="map-name">Карта 3</span><span class="map-score">TBD</span></div>` : ''}
                    ${format === 'BO5' ? `<div class="map-row"><span class="map-name">Карта 3</span><span class="map-score">TBD</span></div><div class="map-row"><span class="map-name">Карта 4</span><span class="map-score">TBD</span></div><div class="map-row"><span class="map-name">Карта 5</span><span class="map-score">TBD</span></div>` : ''}
                </div>
                <div class="match-box">
                    <div class="match-box-title">Информация</div>
                    <div class="info-row"><span class="label">Формат:</span><span class="value">${format}</span></div>
                    <div class="info-row"><span class="label">Турнир:</span><span class="value">${tour}</span></div>
                    <div class="info-row"><span class="label">Дата:</span><span class="value">${date}</span></div>
                </div>
            </div>

            <!-- СТАТИСТИКА (TBD) -->
            <div class="match-box" style="margin-bottom:20px;">
                <div class="match-box-title">Match stats</div>
                <div style="padding:20px; text-align:center; color:var(--muted); font-family:var(--mono); font-size:14px;">
                    TBD
                </div>
            </div>

            <!-- СОСТАВЫ КОМАНД (TBD) -->
            <div class="match-box">
                <div class="match-box-title">Составы команд</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div>
                        <div class="team-title-header"><div style="width:24px; height:24px; background:var(--surface-2); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--muted);">?</div> TBD</div>
                        <table class="player-table">
                            <thead><tr><th>Игрок</th><th>K-D</th><th>ADR</th><th>Rating</th></tr></thead>
                            <tbody>
                                <tr><td>TBD</td><td>TBD</td><td>TBD</td><td>TBD</td></tr>
                                <tr><td>TBD</td><td>TBD</td><td>TBD</td><td>TBD</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div>
                        <div class="team-title-header"><div style="width:24px; height:24px; background:var(--surface-2); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--muted);">?</div> TBD</div>
                        <table class="player-table">
                            <thead><tr><th>Игрок</th><th>K-D</th><th>ADR</th><th>Rating</th></tr></thead>
                            <tbody>
                                <tr><td>TBD</td><td>TBD</td><td>TBD</td><td>TBD</td></tr>
                                <tr><td>TBD</td><td>TBD</td><td>TBD</td><td>TBD</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    } else if (matchId) {
        // ТУТ МОЖЕШЬ ОСТАВИТЬ СТАРУЮ ЛОГИКУ ДЛЯ СЫГРАННЫХ МАТЧЕЙ
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">Загрузка статистики матча #${matchId}...</div>`;
    } else {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--danger);">Матч не найден. <a href="matches.html" style="color:var(--accent);">Вернуться</a></div>`;
    }
</script>

<script src="js/nav.js"></script>
</body>
</html>
