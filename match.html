<script>
    // ==========================================================
    // ПОЛУЧАЕМ ID МАТЧА ИЗ URL
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');

    // ==========================================================
    // РЕНДЕР КОМАНДЫ
    // ==========================================================
    function renderTeamStats(players, isWin) {
        if (!players || players.length === 0) {
            return '<div style="color:#4a5a6e;padding:4px 0;">Нет данных</div>';
        }
        return players.map(p => {
            let nameClass = 'pname';
            if (p.highlight) nameClass += ' highlight';
            if (p.worst) nameClass += ' worst';
            let stats = '';
            if (p.k !== undefined && p.d !== undefined) {
                stats = `<span class="kills">${p.k}</span> - <span class="deaths">${p.d}</span> · ADR ${p.adr || 0}`;
                if (p.a !== undefined) stats += ` · A: ${p.a}`;
            } else if (p.rating !== undefined) {
                stats = `рейтинг ${(p.rating || 0).toFixed(2)}`;
            }
            return `
                <div class="match-page-player">
                    <span class="${nameClass}">${p.name || 'Unknown'}</span>
                    <span class="pstats">${stats}</span>
                </div>
            `;
        }).join('');
    }
