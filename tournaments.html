<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Турниры</title>
    <meta name="description" content="Календарь турниров Mega Professional League на 2027 год.">
    <meta property="og:title" content="MPL — Турниры">
    <meta property="og:description" content="Полное расписание турниров MPL на 2027 год.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text x='50' y='78' font-size='80' text-anchor='middle' fill='%23c8ff00' font-family='monospace' font-weight='bold'>+</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=51">
    <style>
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body class="theme-terminal">
<div class="container">
    <div class="header">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;">
            <div style="display:flex; align-items:flex-start; gap:2px;">
                <svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="-2">MPL</text>
                    <g transform="translate(67, 10)">
                        <rect x="6" y="0" width="4" height="16" fill="var(--accent)" />
                        <rect x="0" y="6" width="16" height="4" fill="var(--accent)" />
                    </g>
                </svg>
            </div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:9px; color:#00d2ff; letter-spacing: 3px; margin-top:-6px; margin-left: 2px;">FRIENDLY MATCHES</div>
        </div>

        <div class="header-right">
            <span>📅 2027</span>
            <span class="status">● UPCOMING</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div>
                    <select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;">
                        <option value="theme-terminal">Terminal (Зеленая)</option>
                        <option value="theme-cyberpunk">Cyberpunk (Розовая)</option>
                        <option value="theme-ocean">Ocean (Синяя)</option>
                        <option value="theme-blood">Blood Moon (Красная)</option>
                        <option value="theme-matrix">Matrix (Черно-зеленая)</option>
                    </select>
                </div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <h1 class="page-title" style="margin-top: 20px;">Календарь турниров</h1>
    
    <div class="tabs-container" style="margin-bottom: 20px; max-width: 300px;">
        <button class="tab-btn active" id="btn-2026" onclick="switchYear(2026)">2026</button>
        <button class="tab-btn" id="btn-2027" onclick="switchYear(2027)">2027</button>
    </div>

    <div id="calendar-content"></div>
    <div class="footer">MPL · Mega Professional League · <b>TOURNAMENTS</b></div>
</div>

<script>
    function toggleTheme() { 
        document.body.classList.toggle('light'); 
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; 
    }
    let lang = 'ru';
    function toggleLang() { 
        lang = lang === 'ru' ? 'en' : 'ru'; 
        document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; 
    }
    function toggleSettings() { 
        const panel = document.getElementById('settingsPanel'); 
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; 
    }
    function changeTheme(themeName) { 
        localStorage.setItem('mpl_theme', themeName); 
        document.body.className = themeName; 
        location.reload(); 
    }
    function resetBg() { 
        document.body.style.backgroundImage = 'none'; 
        document.body.style.backgroundColor = 'var(--bg)'; 
        localStorage.removeItem('mpl_bg'); 
        document.getElementById('bgUpload').value = ''; 
    }
    document.getElementById('bgUpload').addEventListener('change', function(e) { 
        const file = e.target.files[0]; 
        if (file) { 
            const reader = new FileReader(); 
            reader.onload = function(event) { 
                document.body.style.backgroundImage = `url(${event.target.result})`; 
                document.body.style.backgroundSize = 'cover'; 
                document.body.style.backgroundPosition = 'center'; 
                localStorage.setItem('mpl_bg', event.target.result); 
            }; 
            reader.readAsDataURL(file); 
        } 
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal';
        document.body.className = savedTheme; 
        const select = document.getElementById('themeSelect'); if (select) select.value = savedTheme;
        const savedBg = localStorage.getItem('mpl_bg'); 
        if (savedBg) { 
            document.body.style.backgroundImage = `url(${savedBg})`; 
            document.body.style.backgroundSize = 'cover'; 
            document.body.style.backgroundPosition = 'center'; 
        }
    });

    const generate2027Tournaments = () => {
        let tournaments = [];
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const elements = ["FROST", "SNOW", "WIND", "RAIN", "STORM", "HEAT", "SUN", "DROUGHT", "LEAF", "FOG", "COLD", "BLIZZARD"];

        monthNames.forEach((monthName, index) => {
            const mNum = index + 1;
            const el = elements[index];
            const el2 = elements[(index + 3) % 12];

            if (mNum === 6) {
                tournaments.push({ id: `mpl-summer-major-2027`, name: `MPL SUMMER MAJOR 2027`, year: 2027, month: 6, status: "upcoming", dates: `Середина Июня 2027`, prizePool: "TBD (Big)", teamsCount: "16", location: "Online", teams: [], prizeDistribution: [{ place: "Champion", reward: "TBD" }, { place: "Runner-up", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `3-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 12) {
                tournaments.push({ id: `mpl-winter-major-2027`, name: `MPL WINTER MAJOR 2027`, year: 2027, month: 12, status: "upcoming", dates: `Середина Декабря 2027`, prizePool: "TBD (Big)", teamsCount: "16", location: "Online", teams: [], prizeDistribution: [{ place: "Champion", reward: "TBD" }, { place: "Runner-up", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `3-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 1) {
                tournaments.push({ id: `mpl-kickoff-2027`, name: `MPL KICKOFF 2027`, year: 2027, month: 1, status: "upcoming", dates: `2-3 Января 2027`, prizePool: "Points", teamsCount: "6", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }, {place: "2nd", reward: "TBD"}, {place: "3rd-4th", reward: "TBD"}, {place: "5th-6th", reward: "TBD"}] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 7) {
                tournaments.push({ id: `mpl-midseason-2027`, name: `MPL MID-SEASON`, year: 2027, month: 7, status: "upcoming", dates: `1-я неделя Июля 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else {
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }, { place: "2nd", reward: "TBD" }] });
                tournaments.push({ id: `mpl-open-${mNum}-2027`, name: `MPL ${el2} OPEN`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            }
        });
        return tournaments;
    };

    const tournamentsData = [...generate2027Tournaments()];

    let currentYear = 2026;
    function switchYear(year) {
        currentYear = year;
        document.getElementById('btn-2026').classList.remove('active');
        document.getElementById('btn-2027').classList.remove('active');
        document.getElementById('btn-' + year).classList.add('active');
        renderCalendar();
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-content');
        const yearTournaments = tournamentsData.filter(t => t.year === currentYear);
        const months = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        
        let html = '<div class="grid-3">';
        months.forEach((month, index) => {
            const monthTournaments = yearTournaments.filter(t => t.month === index + 1);
            html += `<div class="glass-card" style="min-height: 150px;">
                <div class="panel-title" style="margin-bottom: 10px;">${month} <span>${currentYear}</span></div>`;
            
            if (monthTournaments.length === 0) {
                html += `<div style="color: var(--dim); font-family: var(--mono); font-size: 11px; padding: 10px 0;">— НЕТ ТУРНИРОВ —</div>`;
            } else {
                monthTournaments.forEach(t => {
                    const statusClass = t.status === 'upcoming' ? 'success' : (t.status === 'live' ? 'danger' : 'muted');
                    html += `
                        <a href="tournament.html?id=${t.id}" style="text-decoration: none; color: inherit; display: block; margin-bottom: 10px;">
                            <div class="match-card">
                                <div class="match-top">
                                    <span class="title">${t.name}</span>
                                    <span class="date" style="color: var(--${statusClass})">${t.status.toUpperCase()}</span>
                                </div>
                                <div class="match-teams" style="margin-top: 5px;">
                                    <span style="font-size: 11px; color: var(--muted);">${t.dates}</span>
                                </div>
                            </div>
                        </a>
                    `;
                });
            }
            html += `</div>`;
        });
        html += '</div>';
        container.innerHTML = html;
    }
    window.addEventListener('DOMContentLoaded', () => { renderCalendar(); });
</script>
<script src="js/nav.js"></script>
</body>
</html>
