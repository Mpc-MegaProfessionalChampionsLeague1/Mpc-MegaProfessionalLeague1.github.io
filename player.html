<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль игрока</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .player-page-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }
        .player-page-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d3436, #636e72);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #dfe6e9;
            overflow: hidden;
            border: 4px solid #1a2a3a;
            flex-shrink: 0;
        }
        .player-page-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-page-name {
            font-size: 32px;
            font-weight: 800;
            color: #e8eff7;
        }
        .player-page-name .you-badge {
            color: #ffb347;
            font-size: 18px;
            margin-left: 8px;
        }
        .player-page-sub {
            color: #6e7f94;
            font-size: 14px;
            margin-top: 4px;
        }
        .player-page-sub span {
            color: #c7d5e0;
            font-weight: 500;
        }
        .player-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (max-width: 600px) {
            .player-stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .player-stat-card {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-stat-card .num {
            font-size: 26px;
            font-weight: 700;
            color: #ffb347;
        }
        .player-stat-card .num.good {
            color: #7ddfa0;
        }
        .player-stat-card .num.bad {
            color: #e07a7a;
        }
        .player-stat-card .label {
            font-size: 11px;
            color: #6e7f94;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .player-achievements {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-achievement {
            background: rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-achievement .ach-icon {
            font-size: 16px;
        }
        .player-achievement .ach-name {
            color: #8b9bb0;
        }
        .player-matches-title {
            font-weight: 600;
            font-size: 16px;
            color: #e8eff7;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .player-match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
            border-radius: 6px;
            transition: 0.15s;
            cursor: pointer;
        }
        .player-match-row:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(4px);
        }
        .player-match-row .match-name {
            color: #8b9bb0;
            transition: 0.2s;
        }
        .player-match-row:hover .match-name {
            color: #ffb347;
        }
        .player-match-row .match-stats {
            color: #c7d5e0;
            font-weight: 500;
        }
        .player-match-row .match-stats .good {
            color: #7ddfa0;
        }
        .player-match-row .match-stats .bad {
            color: #e07a7a;
        }
        .player-match-row .match-arrow {
            color: #4a5a6e;
            font-size: 14px;
            transition: 0.2s;
        }
        .player-match-row:hover .match-arrow {
            color: #ffb347;
            transform: translateX(3px);
        }
        .back-btn {
            display: inline-block;
            color: #6e7f94;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 16px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #ffb347;
        }
        body.light .player-match-row:hover {
            background: #f0f3f8;
        }
        body.light .player-match-row .match-name {
            color: #4a5a6e;
        }
        body.light .player-match-row:hover .match-name {
            color: #ffb347;
        }
        body.light .player-match-row .match-arrow {
            color: #b0c4de;
        }
        body.light .player-match-row:hover .match-arrow {
            color: #ffb347;
        }
        .no-history {
            color: #4a5a6e;
            font-size: 13px;
            padding: 16px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1>
        </div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">🇬🇧 EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
        <a href="index.html" class="nav-btn">📊 Главная</a>
        <a href="matches.html" class="nav-btn">📋 Матчи</a>
        <a href="players.html" class="nav-btn active">👥 Игроки</a>
        <a href="stats.html" class="nav-btn">📈 Статистика</a>
        <a href="about.html" class="nav-btn">ℹ️ О сайте</a>
    </nav>

    <!-- PLAYER CONTENT -->
    <div id="playerContent">
        <!-- Рендерится через JS -->
    </div>

    <!-- FOOTER -->
    <div class="footer">
        MPL · Mega Professional League · <b>HLTV-style</b> · Май-Сентябрь 2026
    </div>

</div>

<script src="script-loader.js"></script>

<script>
    // ==========================================================
    // ПОЛУЧАЕМ ИМЯ ИГРОКА ИЗ URL
    // ==========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name');

    // ==========================================================
    // ФУНКЦИЯ ДЛЯ ОЧИСТКИ ИМЕНИ (на всякий случай)
    // ==========================================================
    function cleanName(name) {
        if (!name) return 'Unknown';
        return name.trim().replace(/\s+/g, ' ');
    }

    // ==========================================================
    // ДОСТИЖЕНИЯ
    // ==========================================================
    function getAchievements(player) {
        const ach = [];
        if (player.kd > 1.5) ach.push({ icon: '🥇', name: 'Элитный K/D' });
        if (player.kd > 2.0) ach.push({ icon: '💎', name: 'Легендарный K/D' });
        if (player.diff > 100) ach.push({ icon: '⚡', name: 'Доминатор' });
        if (player.diff > 50 && player.diff <= 100) ach.push({ icon: '🔥', name: 'Кипящий' });
        if (player.adr > 90) ach.push({ icon: '💥', name: 'Урон-машина' });
        if (player.matches >= 4) ach.push({ icon: '🏅', name: 'Ветеран' });
        if (player.name === 'bomba69') ach.push({ icon: '⭐', name: 'MVP турнира' });
        return ach;
    }

    // ==========================================================
    // РЕНДЕР СТРАНИЦЫ ИГРОКА (ИСПРАВЛЕННАЯ ВЕРСИЯ)
    // ==========================================================
    function renderPlayerPage(name) {
        const container = document.getElementById('playerContent');
        const playersData = window.playersData || [];
        const matchData = window.matchData || {};
        const playerMatchHistory = window.playerMatchHistory || {};
        
        // Если имя не передано — показываем ошибку
        if (!name) {
            container.innerHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div style="font-size:48px;margin-bottom:16px;">👀</div>
                    <div style="font-size:20px;font-weight:700;color:#e8eff7;">Игрок не выбран</div>
                    <div style="color:#6e7f94;margin-top:8px;">Вернитесь на страницу <a href="players.html" style="color:#ffb347;">списка игроков</a></div>
                </div>
            `;
            return;
        }

        // Ищем игрока в загруженных данных
        const cleanSearchName = cleanName(name);
        const player = playersData.find(p => cleanName(p.name) === cleanSearchName);
        
        if (!player) {
            container.innerHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div style="font-size:48px;margin-bottom:16px;">❌</div>
                    <div style="font-size:20px;font-weight:700;color:#e8eff7;">Игрок не найден</div>
                    <div style="color:#6e7f94;margin-top:8px;">Вернитесь на страницу <a href="players.html" style="color:#ffb347;">списка игроков</a></div>
                </div>
            `;
            return;
        }

        // БЕРЁМ ИСТОРИЮ ИЗ playerMatchHistory (которая строится в script-loader.js)
        const history = playerMatchHistory[player.name] || [];

        // ДОПОЛНИТЕЛЬНО: если история пустая, пробуем построить её вручную из matchData
        let finalHistory = [...history];
        if (finalHistory.length === 0) {
            // Строим историю вручную
            Object.keys(matchData).forEach(key => {
                const match = matchData[key];
                if (!match || !match.teams) return;
                
                ['win', 'loss'].forEach(side => {
                    const team = match.teams[side];
                    if (!team || !team.players) return;
                    const p = team.players.find(p2 => cleanName(p2.name) === cleanName(player.name));
                    if (p) {
                        finalHistory.push({
                            match: match.title || key,
                            k: p.k || 0,
                            d: p.d || 0,
                            diff: (p.k || 0) - (p.d || 0),
                            map: match.map || '',
                            id: key
                        });
                    }
                });
            });
        }

        const achievements = getAchievements(player);

        container.innerHTML = `
            <a href="players.html" class="back-btn">← Назад к списку игроков</a>

            <div class="player-page-header">
                <div class="player-page-avatar">
                    ${player.avatar ? `<img src="${player.avatar}" alt="${player.name}">` : (player.name ? player.name.charAt(0).toUpperCase() : '?')}
                </div>
                <div>
                    <div class="player-page-name">
                        ${player.name || 'Unknown'}
                        ${player.you ? '<span class="you-badge">⭐</span>' : ''}
                    </div>
                    <div class="player-page-sub">
                        ${player.matches || 0} матчей · ${player.k || 0} убийств · ${player.d || 0} смертей · ${player.a || 0} ассистов
                        ${player.you ? ' · <b style="color:#ffb347;">Это вы</b>' : ''}
                    </div>
                </div>
            </div>

            <div class="player-stats-grid">
                <div class="player-stat-card">
                    <div class="num">${(player.kd || 0).toFixed(2)}</div>
                    <div class="label">K/D</div>
                </div>
                <div class="player-stat-card">
                    <div class="num">${player.adr || 0}</div>
                    <div class="label">ADR</div>
                </div>
                <div class="player-stat-card">
                    <div class="num ${(player.diff || 0) > 0 ? 'good' : 'bad'}">${(player.diff || 0) > 0 ? '+' : ''}${player.diff || 0}</div>
                    <div class="label">Разница</div>
                </div>
                <div class="player-stat-card">
                    <div class="num">${(player.rating || 0).toFixed(2)}</div>
                    <div class="label">Рейтинг</div>
                </div>
            </div>

            ${achievements.length > 0 ? `
                <div class="player-achievements">
                    ${achievements.map(a => `
                        <div class="player-achievement">
                            <span class="ach-icon">${a.icon}</span>
                            <span class="ach-name">${a.name}</span>
                        </div>
                    `).join('')}
                </div>
            ` : `
                <div style="font-size:13px;color:#6e7f94;margin-bottom:16px;">Нет достижений</div>
            `}

            <div class="player-matches-title">📋 История матчей <span style="font-size:12px;color:#6e7f94;font-weight:400;">(кликните для перехода)</span></div>
            ${finalHistory.length > 0 ? finalHistory.map((m, index) => `
                <div class="player-match-row" onclick="location.href='match.html?id=${m.id || 'match' + index}'">
                    <span class="match-name">${m.match || 'Матч'} — ${m.map || ''}</span>
                    <span class="match-stats">
                        ${m.k || 0} - ${m.d || 0}
                        <span class="${(m.diff || 0) > 0 ? 'good' : 'bad'}">${(m.diff || 0) > 0 ? '+' : ''}${m.diff || 0}</span>
                        <span class="match-arrow">→</span>
                    </span>
                </div>
            `).join('') : `
                <div class="no-history">Нет данных о матчах для этого игрока</div>
            `}
        `;
    }

    // ==========================================================
    // ТЕМА / ЯЗЫК
    // ==========================================================
    function toggleTheme() {
        document.body.classList.toggle('light');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '🌙' : '🌙';
    }

    let lang = 'ru';

    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('langBtn').textContent = lang === 'ru' ? '🇬🇧 EN' : '🇷🇺 RU';
    }

    // ==========================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ==========================================================
    function initPlayer() {
        renderPlayerPage(playerName);
    }

    // Ждём загрузки данных
    document.addEventListener('dataLoaded', initPlayer);
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPlayer);
    } else {
        setTimeout(initPlayer, 500);
    }

    // Резерв: проверяем наличие данных каждые 500 мс
    let attempts = 0;
    const checkData = setInterval(() => {
        attempts++;
        if (window.playersData && window.playersData.length > 0) {
            clearInterval(checkData);
            initPlayer();
        } else if (attempts > 20) {
            clearInterval(checkData);
            console.warn('⚠️ Данные не загружены, показываем пустую страницу');
            initPlayer();
        }
    }, 500);
</script>

</body>
</html>
