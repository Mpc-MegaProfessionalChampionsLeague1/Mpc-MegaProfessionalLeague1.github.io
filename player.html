<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль игрока</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .player-page-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }
        .player-page-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d3436, #636e72);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #dfe6e9;
            overflow: hidden;
            border: 4px solid #1a2a3a;
            flex-shrink: 0;
        }
        .player-page-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-page-name {
            font-size: 32px;
            font-weight: 800;
            color: #e8eff7;
        }
        .player-page-name .you-badge {
            color: #ffb347;
            font-size: 18px;
            margin-left: 8px;
        }
        .player-page-sub {
            color: #6e7f94;
            font-size: 14px;
            margin-top: 4px;
        }
        .player-page-sub span {
            color: #c7d5e0;
            font-weight: 500;
        }

        .player-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (max-width: 600px) {
            .player-stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .player-stat-card {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-stat-card .num {
            font-size: 26px;
            font-weight: 700;
            color: #ffb347;
        }
        .player-stat-card .num.good {
            color: #7ddfa0;
        }
        .player-stat-card .num.bad {
            color: #e07a7a;
        }
        .player-stat-card .label {
            font-size: 11px;
            color: #6e7f94;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .player-achievements {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-achievement {
            background: rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .player-achievement .ach-icon {
            font-size: 16px;
        }
        .player-achievement .ach-name {
            color: #8b9bb0;
        }

        .player-matches-title {
            font-weight: 600;
            font-size: 16px;
            color: #e8eff7;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .player-match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
            border-radius: 6px;
            transition: 0.15s;
            cursor: pointer;
        }
        .player-match-row:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(4px);
        }
        .player-match-row .match-name {
            color: #8b9bb0;
            transition: 0.2s;
        }
        .player-match-row:hover .match-name {
            color: #ffb347;
        }
        .player-match-row .match-stats {
            color: #c7d5e0;
            font-weight: 500;
        }
        .player-match-row .match-stats .good {
            color: #7ddfa0;
        }
        .player-match-row .match-stats .bad {
            color: #e07a7a;
        }
        .player-match-row .match-arrow {
            color: #4a5a6e;
            font-size: 14px;
            transition: 0.2s;
        }
        .player-match-row:hover .match-arrow {
            color: #ffb347;
            transform: translateX(3px);
        }

        .back-btn {
            display: inline-block;
            color: #6e7f94;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 16px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #ffb347;
        }

        body.light .player-match-row:hover {
            background: #f0f3f8;
        }
        body.light .player-match-row .match-name {
            color: #4a5a6e;
        }
        body.light .player-match-row:hover .match-name {
            color: #ffb347;
        }
        body.light .player-match-row .match-arrow {
            color: #b0c4de;
        }
        body.light .player-match-row:hover .match-arrow {
            color: #ffb347;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1>
        </div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">🇬🇧 EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- NAV -->
    <nav class="nav">
    <a href="index.html" class="nav-btn active">01 / Главная</a>
    <a href="matches.html" class="nav-btn">02 / Матчи</a>
    <a href="players.html" class="nav-btn">03 / Игроки</a>
    <a href="stats.html" class="nav-btn">04 / Статистика</a>
    <a href="about.html" class="nav-btn">05 / О сайте</a>
    </nav>

    <!-- PLAYER CONTENT -->
    <div id="playerContent">
        <!-- Рендерится через JS -->
    </div>

    <!-- FOOTER -->
    <div class="footer">
        MPL · Mega Professional League · <b>HLTV-style</b> · Май-Сентябрь 2026
    </div>

</div>

<script src="js/data.js"></script>
<script>
    // ===== ПОЛУЧАЕМ ИМЯ ИГРОКА ИЗ URL =====
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name');

    // ===== ФУНКЦИЯ ДЛЯ ПОЛУЧЕНИЯ ID МАТЧА ПО НОМЕРУ =====
    function getMatchId(matchNumber) {
        // matchNumber может быть "#0 BO3", "#1", "#2" и т.д.
        const num = matchNumber.replace(/\D/g, '');
        if (num === '0') return 'match0';
        if (num === '1') return 'match1';
        if (num === '2') return 'match2';
        if (num === '3') return 'match3';
        if (num === '4') return 'match4';
        if (num === '5') return 'match5';
        return 'match0';
    }

   function renderPlayerPage(name) {
    const container = document.getElementById('playerContent');
    
    if (!name) {
        container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не выбран</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
        return;
    }

    const player = playersData.find(p => p.name === name);
    if (!player) {
        container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не найден</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
        return;
    }

    const history = playerMatchHistory[player.name] || [];
    const achievements = getAchievements(player);
    const steamUrl = player.steam || '#';

    // Генерация спарклайна (графика K/D по матчам)
    let sparklineHTML = '';
    if (history.length > 1) {
        const kdValues = history.map(m => m.k / (m.d || 1)).reverse(); // от старых к новым
        const maxKd = Math.max(...kdValues, 1.5);
        const width = 300;
        const height = 60;
        const stepX = width / (kdValues.length - 1);
        
        let pathD = '';
        let areaD = `M 0,${height} `;
        let dots = '';

        kdValues.forEach((val, i) => {
            const x = i * stepX;
            const y = height - (val / maxKd) * height;
            if (i === 0) pathD += `M ${x},${y} `;
            else pathD += `L ${x},${y} `;
            areaD += `L ${x},${y} `;
            dots += `<circle class="sparkline-dot" cx="${x}" cy="${y}" r="3" />`;
        });
        areaD += `L ${width},${height} Z`;

        sparklineHTML = `
            <div class="sparkline-container">
                <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;">K/D по матчам (от старых к новым)</div>
                <svg class="sparkline-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <path class="sparkline-area" d="${areaD}" />
                    <path class="sparkline-path" d="${pathD}" />
                    ${dots}
                </svg>
            </div>
        `;
    }

    container.innerHTML = `
        <a href="players.html" class="back-btn">← Назад к списку игроков</a>

        <div class="player-page-header">
            <div class="player-page-avatar">
                ${player.avatar ? `<img src="${player.avatar}" alt="${player.name}">` : player.name.charAt(0).toUpperCase()}
            </div>
            <div style="flex:1;">
                <div class="player-page-name">
                    ${player.name}
                    ${player.you ? '<span class="you-badge">⭐</span>' : ''}
                </div>
                <div class="player-page-sub" style="margin-bottom:12px;">
                    ${player.matches} матчей · ${player.k} убийств · ${player.d} смертей
                </div>
                ${player.steam ? `
                    <a href="${player.steam}" target="_blank" class="btn-steam">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                        Steam
                    </a>
                ` : ''}
            </div>
        </div>

        <div class="player-stats-grid">
            <div class="player-stat-card"><div class="num">${player.kd.toFixed(2)}</div><div class="label">K/D</div></div>
            <div class="player-stat-card"><div class="num">${player.adr}</div><div class="label">ADR</div></div>
            <div class="player-stat-card"><div class="num ${player.diff > 0 ? 'good' : 'bad'}">${player.diff > 0 ? '+' : ''}${player.diff}</div><div class="label">Разница</div></div>
            <div class="player-stat-card"><div class="num">${player.rating.toFixed(2)}</div><div class="label">Рейтинг</div></div>
        </div>

        ${sparklineHTML}

        ${achievements.length > 0 ? `
            <div class="player-achievements" style="margin-top:20px;">
                ${achievements.map(a => `
                    <div class="player-achievement">
                        <span class="ach-icon">${a.icon}</span>
                        <span class="ach-name">${a.name}</span>
                    </div>
                `).join('')}
            </div>
        ` : ''}

        <div class="player-matches-title" style="margin-top:24px;">📋 История матчей <span style="font-size:11px;color:var(--muted);font-weight:400;">(кликните для перехода)</span></div>
        ${history.length > 0 ? history.map(m => {
            let streakIcon = '';
            const kd = m.k / (m.d || 1);
            if (kd >= 1.5) streakIcon = '🔥';
            else if (kd < 0.5) streakIcon = '🧊';
            
            return `
            <div class="player-match-row" onclick="location.href='match.html?id=${getMatchId(m.match)}'">
                <span class="match-name">${m.match} — ${m.map} ${streakIcon}</span>
                <span class="match-stats">
                    ${m.k} - ${m.d}
                    <span class="${m.diff > 0 ? 'good' : 'bad'}">${m.diff > 0 ? '+' : ''}${m.diff}</span>
                    <span class="match-arrow">→</span>
                </span>
            </div>
        `}).join('') : '<div style="font-size:13px;color:var(--muted);">Нет данных о матчах</div>'}
    `;
}

    // ==========================================================
    // ТЕМА / ЯЗЫК
    // ==========================================================
    function toggleTheme() {
        document.body.classList.toggle('light');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '🌙' : '🌙';
    }

    let lang = 'ru';

    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('langBtn').textContent = lang === 'ru' ? '🇬🇧 EN' : '🇷🇺 RU';
    }

    // ==========================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ==========================================================
    renderPlayerPage(playerName);
</script>

</body>
</html>
