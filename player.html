<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Детали матча</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=36">
    <style>
        .hltv-match-header { background: #1f232b; border: 1px solid var(--border); display: flex; align-items: stretch; position: relative; margin-bottom: 20px; }
        .hltv-team-side { flex: 1; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
        .hltv-team-side.win { background: rgba(125, 223, 160, 0.05); }
        .hltv-team-side.loss { background: rgba(224, 122, 122, 0.05); }
        .hltv-logo { width: 60px; height: 60px; object-fit: contain; }
        .hltv-team-name { font-size: 20px; font-weight: 700; color: #fff; }
        .hltv-score { font-size: 36px; font-weight: 800; font-family: var(--mono); color: var(--accent); }
        .hltv-match-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 30px; background: #171a21; border-left: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; }
        .hltv-match-time { font-size: 24px; font-weight: 800; color: #fff; font-family: var(--mono); }
        .hltv-match-date { font-size: 11px; color: #8b9bb0; margin-top: 4px; }
        .hltv-match-status { font-size: 12px; font-weight: 700; color: var(--dim); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }

        /* ===== НОВЫЙ ЗАГОЛОВОК ТАБЛИЦЫ ===== */
        .hltv-table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1e26;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .hltv-table-team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hltv-table-team-info img { width: 28px; height: 28px; object-fit: contain; }
        .hltv-table-team-info span { font-size: 16px; font-weight: 700; color: #fff; }
        .hltv-table-score {
            font-family: var(--mono);
            font-size: 24px;
            font-weight: 800;
        }
        .hltv-table-score.win { color: var(--success); }
        .hltv-table-score.loss { color: var(--danger); }

        /* ===== ОСТАЛЬНОЕ БЕЗ ИЗМЕНЕНИЙ ===== */
        .map-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
        .map-tab { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 8px 20px; font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .map-tab:hover { color: var(--text); border-color: var(--accent); }
        .map-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .hltv-table-wrapper { margin-bottom: 30px; border: 1px solid var(--border); }
        
        .hltv-stats-table { width: 100%; border-collapse: collapse; background: var(--surface); }
        .hltv-stats-table th { text-align: left; padding: 10px 14px; font-family: var(--mono); font-size: 11px; color: #8b9bb0; border-bottom: 1px solid var(--border); text-transform: uppercase; background: #1a1e26; }
        .hltv-stats-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); font-family: var(--mono); }
        .hltv-stats-table tr:hover td { background: #1f232b; cursor: pointer; }
        .hltv-stats-player { font-weight: 600; color: #fff; font-family: var(--sans); display: flex; align-items: center; gap: 8px; }
        .hltv-stats-player img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; border: 1px solid #555; }
        .stat-good { color: var(--success); font-weight: 700; }
        .stat-bad { color: var(--danger); font-weight: 700; }

        .hltv-lineups-title { font-size: 18px; font-weight: 700; color: #fff; margin: 30px 0 16px 0; display: flex; align-items: center; gap: 10px; }
        .hltv-lineup-team { margin-bottom: 30px; }
        .hltv-lineup-header { display: flex; justify-content: space-between; align-items: center; background: #1a1e26; padding: 10px 16px; border: 1px solid var(--border); border-bottom: none; }
        .hltv-lineup-header .team-info { display: flex; align-items: center; gap: 10px; }
        .hltv-lineup-header img { width: 32px; height: 32px; }
        .hltv-lineup-header span { font-size: 16px; font-weight: 700; color: #fff; }
        
        .hltv-lineup-cards { display: flex; gap: 2px; background: var(--border); border: 1px solid var(--border); }
        .hltv-player-card { flex: 1; background: #2a2e37; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .hltv-card-photo { width: 100%; height: 140px; background: #222; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; }
        .hltv-card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .hltv-card-footer { width: 100%; display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #111; border-top: 1px solid #333; z-index: 2; }
        .hltv-card-footer .flag-svg { width: 18px; height: 12px; border-radius: 1px; }
        .hltv-card-footer .player-nick { font-size: 12px; font-weight: 700; color: #fff; font-family: var(--mono); }

        .hltv-mvp { background: var(--surface); border: 1px solid var(--accent); padding: 20px; display: flex; align-items: center; gap: 20px; margin-top: 20px; position: relative; overflow: hidden; }
        .hltv-mvp::before { content: 'MVP'; position: absolute; right: -10px; top: -20px; font-size: 120px; font-weight: 900; font-family: var(--mono); color: rgba(200, 255, 0, 0.05); z-index: 0; }
        .hltv-mvp-avatar { width: 80px; height: 80px; border-radius: 8px; border: 2px solid #777; position: relative; overflow: hidden; z-index: 1; }
        .hltv-mvp-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .hltv-mvp-info { z-index: 1; }
        .hltv-mvp-name { font-size: 24px; font-weight: 800; color: #fff; }
        .hltv-mvp-stats { font-family: var(--mono); font-size: 14px; color: var(--accent); margin-top: 4px; }

        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: #1a1e26; border: 1px solid #444; border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:#fff; border-bottom:1px solid #333; padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Цвет акцента:</div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="setAccent('#c8ff00')" style="width:24px; height:24px; background:#c8ff00; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#00d2ff')" style="width:24px; height:24px; background:#00d2ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ff0055')" style="width:24px; height:24px; background:#ff0055; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#b000ff')" style="width:24px; height:24px; background:#b000ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ffb347')" style="width:24px; height:24px; background:#ffb347; border:none; border-radius:4px; cursor:pointer;"></button>
                    </div>
                </div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:#fff; background:#111; border:1px solid #333; padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:#333; border:none; color:#fff; padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn active">02 / Матчи</a>
        <a href="players.html" class="nav-btn">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div id="matchContent"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');

    const tf2Logo = 'img/tf2.png';
    const magicLogo = 'img/magic.png';
    const defaultImg = 'img/default.png';
    const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`;
    const flagSVG = `<svg class="flag-svg" viewBox="0 0 100 70"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;

    let currentMatchData = null;

    function getTeamLogo(teamName) {
        if (teamName.includes('Fortress') || teamName === 'TF2' || teamName === 'Team 1') return tf2Logo;
        if (teamName.includes('Magic') || teamName === 'Team 2') return magicLogo;
        return fallbackSVG;
    }

    function renderMatchPage(id) {
        const container = document.getElementById('matchContent');
        if (!id || !matchData[id]) {
            container.innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:24px;">❌</div><div style="font-size:20px;font-weight:700;color:#fff;margin-top:10px;">Матч не найден</div><a href="matches.html" style="color:var(--accent);margin-top:10px;display:inline-block;">← Назад к матчам</a></div>`;
            return;
        }

        currentMatchData = matchData[id];
        const data = currentMatchData;
        const isBo3 = id === 'match0';
        
        // УМНАЯ ЛОГИКА СЧЕТА И ПОБЕДИТЕЛЯ
        let score1 = parseInt(data.score.split(':')[0]);
        let score2 = parseInt(data.score.split(':')[1]);
        
        // Определяем, кто реально выиграл по цифрам
        let actualWinnerName = score1 > score2 ? data.winner : data.loser;
        let actualLoserName = score1 > score2 ? data.loser : data.winner;
        
        const team1Name = actualWinnerName.includes('Team 1') || actualWinnerName.includes('Team Fortress') ? 'Team Fortress 2' : 'Team 2';
        const team2Name = actualLoserName.includes('Team 2') || actualLoserName.includes('Team Magic') ? 'Team Magic' : 'Team 1';
        
        const team1Logo = getTeamLogo(actualWinnerName);
        const team2Logo = getTeamLogo(actualLoserName);

        // Заголовки для таблиц
        const winScore = Math.max(score1, score2);
        const lossScore = Math.min(score1, score2);

        let mapsHTML = '';
        if (isBo3) {
            mapsHTML = `
                <div class="hltv-maps-list">
                    <div class="hltv-box-title">Карты</div>
                    <div class="hltv-map-row"><span class="hltv-map-name">Ancient</span><span class="hltv-map-score">${data.map1.score}</span></div>
                    <div class="hltv-map-row"><span class="hltv-map-name">Anubis</span><span class="hltv-map-score">${data.map2.score}</span></div>
                </div>
                <div class="hltv-info-box">
                    <div class="hltv-box-title">Информация</div>
                    <div style="font-size:12px; color:#8b9bb0; line-height:1.6;">
                        <p>Формат: <b style="color:#fff;">Best of 3 (BO3)</b></p>
                        <p>Турнир: MPL Season 1</p>
                        <p>Дата: ${data.date}</p>
                    </div>
                </div>
            `;
        } else {
            mapsHTML = `
                <div class="hltv-maps-list">
                    <div class="hltv-box-title">Карта</div>
                    <div class="hltv-map-row"><span class="hltv-map-name">${data.map}</span><span class="hltv-map-score">${data.score}</span></div>
                </div>
                <div class="hltv-info-box">
                    <div class="hltv-box-title">Информация</div>
                    <div style="font-size:12px; color:#8b9bb0; line-height:1.6;">
                        <p>Формат: <b style="color:#fff;">Best of 1 (BO1)</b></p>
                        <p>Турнир: MPL Season 1</p>
                        <p>Дата: ${data.date}</p>
                    </div>
                </div>
            `;
        }

        let tabsHTML = '';
        if (isBo3) {
            tabsHTML = `
                <div class="map-tabs">
                    <button class="map-tab active" onclick="switchMapStats('all')" id="tab-all">All maps</button>
                    <button class="map-tab" onclick="switchMapStats('map1')" id="tab-map1">${data.map1.name}</button>
                    <button class="map-tab" onclick="switchMapStats('map2')" id="tab-map2">${data.map2.name}</button>
                </div>
            `;
        } else {
            tabsHTML = `
                <div class="map-tabs">
                    <button class="map-tab active" onclick="switchMapStats('all')">${data.map}</button>
                </div>
            `;
        }

        container.innerHTML = `
            <a href="matches.html" class="back-btn">← Назад ко всем матчам</a>

            <div class="hltv-match-header">
                <div class="hltv-team-side win">
                    <img src="${team1Logo}" class="hltv-logo" onerror="this.src='${fallbackSVG}';">
                    <div><div class="hltv-team-name">${team1Name}</div></div>
                    <div class="hltv-score">${winScore}</div>
                </div>
                <div class="hltv-match-center">
                    <div class="hltv-match-time">${data.title.replace('Матч ', '').replace('🏆 ', '')}</div>
                    <div class="hltv-match-date">${data.date}</div>
                    <div class="hltv-match-status">Match over</div>
                </div>
                <div class="hltv-team-side loss">
                    <div class="hltv-score">${lossScore}</div>
                    <div><div class="hltv-team-name">${team2Name}</div></div>
                    <img src="${team2Logo}" class="hltv-logo" onerror="this.src='${fallbackSVG}';">
                </div>
            </div>

            <div class="hltv-maps-grid">${mapsHTML}</div>

            <div class="hltv-box-title" style="background:none; border:none; padding:0; margin-bottom:12px; font-size:16px;">📊 Match stats</div>
            ${tabsHTML}
            <div id="statsTableContainer"></div>
            
            <div id="lineupsContainer"></div>
            <div id="mvpContainer"></div>
        `;

        switchMapStats('all');
    }

    function switchMapStats(mapType) {
        document.querySelectorAll('.map-tab').forEach(btn => btn.classList.remove('active'));
        if (mapType === 'all') document.getElementById('tab-all')?.classList.add('active');
        if (mapType === 'map1') document.getElementById('tab-map1')?.classList.add('active');
        if (mapType === 'map2') document.getElementById('tab-map2')?.classList.add('active');

        const data = currentMatchData;
        const isBo3 = data.map1 !== undefined;
        let winPlayers = [], lossPlayers = [];
        let winnerName = '', loserName = '';
        let winScore = 0, lossScore = 0;

        // Определяем счет для текущей вкладки (карты)
        const matchScore1 = parseInt(data.score.split(':')[0]);
        const matchScore2 = parseInt(data.score.split(':')[1]);
        const actualWinnerName = matchScore1 > matchScore2 ? data.winner : data.loser;
        const actualLoserName = matchScore1 > matchScore2 ? data.loser : data.winner;

        if (mapType === 'all') {
            const source = data.total ? data.total.teams : data.teams;
            winPlayers = source.win.players;
            lossPlayers = source.loss.players;
            winnerName = source.win.name;
            loserName = source.loss.name;
            winScore = Math.max(matchScore1, matchScore2);
            lossScore = Math.min(matchScore1, matchScore2);
        } else if (mapType === 'map1') {
            winPlayers = data.map1.teams.win.players;
            lossPlayers = data.map1.teams.loss.players;
            winnerName = data.map1.teams.win.name;
            loserName = data.map1.teams.loss.name;
            // Счет карты
            const mapScore1 = parseInt(data.map1.score.split(':')[0]);
            const mapScore2 = parseInt(data.map1.score.split(':')[1]);
            winScore = Math.max(mapScore1, mapScore2);
            lossScore = Math.min(mapScore1, mapScore2);
        } else if (mapType === 'map2') {
            winPlayers = data.map2.teams.win.players;
            lossPlayers = data.map2.teams.loss.players;
            winnerName = data.map2.teams.win.name;
            loserName = data.map2.teams.loss.name;
            // Счет карты
            const mapScore1 = parseInt(data.map2.score.split(':')[0]);
            const mapScore2 = parseInt(data.map2.score.split(':')[1]);
            winScore = Math.max(mapScore1, mapScore2);
            lossScore = Math.min(mapScore1, mapScore2);
        }

        // Функция для таблицы с добавленным счетом в заголовок
        const generateTable = (players, teamName, logo, score, isWin) => {
            const sorted = [...players].sort((a,b) => (b.rating || (b.k/b.d)) - (a.rating || (a.k/a.d)));
            return `
                <div class="hltv-table-wrapper">
                    <div class="hltv-table-header">
                        <div class="hltv-table-team-info">
                            <img src="${logo}" onerror="this.src='${fallbackSVG}';">
                            <span>${teamName}</span>
                        </div>
                        <!-- СЧЕТ В ЗАГОЛОВКЕ -->
                        <div class="hltv-table-score ${isWin ? 'win' : 'loss'}">${score}</div>
                    </div>
                    <table class="hltv-stats-table">
                        <thead>
                            <tr><th>Игрок</th><th>K-D</th><th>Разница</th><th>ADR</th><th>Ассисты</th><th>Rating</th></tr>
                        </thead>
                        <tbody>
                            ${sorted.map(p => {
                                const rating = p.rating || (p.k / (p.d || 1));
                                return `
                                <tr onclick="location.href='player.html?name=${encodeURIComponent(p.name)}'">
                                    <td><div class="hltv-stats-player"><img src="${defaultImg}"><span>${p.name}</span></div></td>
                                    <td>${p.k}-${p.d}</td>
                                    <td class="${p.diff > 0 ? 'stat-good' : 'stat-bad'}">${p.diff > 0 ? '+' : ''}${p.diff}</td>
                                    <td>${p.adr || '—'}</td>
                                    <td>${p.a || '—'}</td>
                                    <td class="${rating >= 1 ? 'stat-good' : 'stat-bad'}">${rating.toFixed(2)}</td>
                                </tr>
                            `}).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        };

        const getLogoForName = (name) => {
            if (name.includes('Fortress') || name.includes('Team 1')) return tf2Logo;
            if (name.includes('Magic') || name.includes('Team 2')) return magicLogo;
            return fallbackSVG;
        };

        document.getElementById('statsTableContainer').innerHTML = 
            generateTable(winPlayers, winnerName, getLogoForName(winnerName), winScore, true) + 
            generateTable(lossPlayers, loserName, getLogoForName(loserName), lossScore, false);

        // MVP
        const allMapPlayers = [...winPlayers, ...lossPlayers];
        const mvpPlayer = allMapPlayers.sort((a,b) => (b.rating || (b.k/b.d)) - (a.rating || (a.k/a.d)))[0];
        
        if (mvpPlayer) {
            const mvpRating = mvpPlayer.rating || (mvpPlayer.k / (mvpPlayer.d || 1));
            document.getElementById('mvpContainer').innerHTML = `
                <div class="hltv-mvp">
                    <div class="hltv-mvp-avatar"><img src="${defaultImg}"></div>
                    <div class="hltv-mvp-info">
                        <div style="font-size:12px; font-family:var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:1px;">MVP ${mapType === 'all' ? 'Матча' : 'Карты'}</div>
                        <div class="hltv-mvp-name">${mvpPlayer.name}</div>
                        <div class="hltv-mvp-stats">Рейтинг ${mvpRating.toFixed(2)} · K/D ${(mvpPlayer.k/mvpPlayer.d).toFixed(2)}</div>
                    </div>
                </div>
            `;
        }
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }

    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }
    function setAccent(color) { document.documentElement.style.setProperty('--accent', color); localStorage.setItem('mpl_accent', color); }
    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); }
    });
    window.addEventListener('DOMContentLoaded', () => {
        const savedAccent = localStorage.getItem('mpl_accent'); if (savedAccent) setAccent(savedAccent);
        const savedBg = localStorage.getItem('mpl_bg'); if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
    });

    renderMatchPage(matchId);
</script>
</body>
