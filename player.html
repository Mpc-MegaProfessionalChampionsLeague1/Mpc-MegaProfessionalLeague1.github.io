<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль игрока</title>
    <!-- ПОДКЛЮЧАЕМ БИБЛИОТЕКУ ДЛЯ СКАЧИВАНИЯ КАРТИНКИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=23">
    <style>
        .avatar-wrapper {
            position: relative; width: 100px; height: 100px; border-radius: 6px; border: 2px solid #777;
            background: #1a1a1a; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .avatar-bg-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 80%; opacity: 0.3; object-fit: contain; z-index: 1; }
        .avatar-player-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
        
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: #1a1e26; border: 1px solid #444; border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:#fff; border-bottom:1px solid #333; padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Цвет акцента:</div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="setAccent('#c8ff00')" style="width:24px; height:24px; background:#c8ff00; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#00d2ff')" style="width:24px; height:24px; background:#00d2ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ff0055')" style="width:24px; height:24px; background:#ff0055; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#b000ff')" style="width:24px; height:24px; background:#b000ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ffb347')" style="width:24px; height:24px; background:#ffb347; border:none; border-radius:4px; cursor:pointer;"></button>
                    </div>
                </div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:#fff; background:#111; border:1px solid #333; padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:#333; border:none; color:#fff; padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn active">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div id="playerContent"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name');

    function getMatchId(matchNumber) {
        const num = matchNumber.replace(/\D/g, '');
        return 'match' + num;
    }

    const tf2Roster = ['bomba69', 'Хомяк с авт', 'uxaxaxaxa', 'AFKE'];
    const magicRoster = ['abdalbek', 'Gonduras228', 'Adjiare Gudju', 'baksyhanovvand...'];

    function renderPlayerPage(name) {
        const container = document.getElementById('playerContent');
        if (!name) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не выбран</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }
        const player = playersData.find(p => p.name === name);
        if (!player) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не найден</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }

        const history = (typeof playerMatchHistory !== 'undefined' && playerMatchHistory[player.name]) ? playerMatchHistory[player.name] : [];
        const achievements = (typeof getAchievements === 'function') ? getAchievements(player) : [];
        const defaultImg = 'img/default.png';
        
        let teamLogo = '';
        let teamName = '';
        
        if (tf2Roster.includes(player.name)) { teamLogo = 'img/tf2.png'; teamName = 'Team Fortress 2'; }
        else if (magicRoster.includes(player.name)) { teamLogo = 'img/magic.png'; teamName = 'Team Magic'; }
        else { teamLogo = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`; teamName = 'Без команды'; }

        const flagSVG = `<svg viewBox="0 0 100 70" style="width:18px; height:12px; border-radius:2px; display:inline-block; vertical-align:middle;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;

        let sparklineHTML = '';
        if (history.length > 1) {
            const kdValues = history.map(m => m.k / (m.d || 1)).reverse();
            const maxKd = Math.max(...kdValues, 1.5);
            const width = 300; const height = 60; const stepX = width / (kdValues.length - 1);
            let pathD = ''; let areaD = `M 0,${height} `; let dots = '';
            kdValues.forEach((val, i) => {
                const x = i * stepX; const y = height - (val / maxKd) * height;
                if (i === 0) pathD += `M ${x},${y} `; else pathD += `L ${x},${y} `;
                areaD += `L ${x},${y} `;
                dots += `<circle class="sparkline-dot" cx="${x}" cy="${y}" r="3" />`;
            });
            areaD += `L ${width},${height} Z`;
            sparklineHTML = `
                <div class="sparkline-container">
                    <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;">K/D по матчам</div>
                    <svg class="sparkline-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                        <path class="sparkline-area" d="${areaD}" /><path class="sparkline-path" d="${pathD}" />${dots}
                    </svg>
                </div>
            `;
        }

        let h2hHTML = '';
        if (typeof matchData !== 'undefined') {
            const teammates = {};
            Object.keys(matchData).forEach(key => {
                const m = matchData[key];
                const teams = m.teams || (m.total && m.total.teams);
                if (!teams) return;
                ['win', 'loss'].forEach(side => {
                    const team = teams[side];
                    if (!team) return;
                    const inTeam = team.players.some(p => p.name === player.name);
                    if (inTeam) {
                        team.players.forEach(p => {
                            if (p.name !== player.name) {
                                if (!teammates[p.name]) teammates[p.name] = { wins: 0, total: 0 };
                                teammates[p.name].total++;
                                if (side === 'win') teammates[p.name].wins++;
                            }
                        });
                    }
                });
            });
            const sorted = Object.entries(teammates).sort((a,b) => b[1].total - a[1].total).slice(0, 5);
            h2hHTML = sorted.length > 0 ? sorted.map(([name, data]) => {
                const wr = Math.round((data.wins / data.total) * 100);
                return `
                    <div class="h2h-item">
                        <span class="h2h-name">${name}</span>
                        <span><span class="h2h-wins">${data.wins}W</span> / <span class="h2h-losses">${data.total - data.wins}L</span> <span style="color:var(--muted);margin-left:8px;">(${wr}%)</span></span>
                    </div>
                `;
            }).join('') : '<div style="color:var(--muted);font-size:12px;">Нет данных</div>';
        } else {
            h2hHTML = '<div style="color:var(--muted);font-size:12px;">Нет данных</div>';
        }

        container.innerHTML = `
            <a href="players.html" class="back-btn">← Назад к списку игроков</a>
            
            <!-- КНОПКА СКАЧИВАНИЯ -->
            <div style="text-align:right; margin-bottom: 16px;" id="downloadBtnWrapper">
                <button onclick="downloadCard('${player.name}')" style="background: var(--surface); border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 4px; font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.2s;" onmouseover="this.style.background='var(--accent)'; this.style.color='#000';" onmouseout="this.style.background='var(--surface)'; this.style.color='var(--accent)';">
                    📸 Скачать карточку
                </button>
            </div>

            <!-- НАЧАЛО КАРТОЧКИ ДЛЯ СКАЧИВАНИЯ -->
            <div id="player-card-export" style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
            
            <div class="player-page-header">
                <div class="avatar-wrapper">
                    <img src="${teamLogo}" class="avatar-bg-logo" alt="${teamName}">
                    <img src="${defaultImg}" class="avatar-player-img" alt="${player.name}">
                </div>
                
                <div style="flex:1;">
                    <div class="player-page-name">${player.name} ${player.you ? '<span class="you-badge">⭐</span>' : ''}</div>
                    <div class="player-page-sub" style="margin-bottom:12px; display:flex; align-items:center; gap:6px;">
                        ${flagSVG} Russia · ${player.matches} матчей · ${player.k} убийств · ${player.d} смертей
                        <span style="margin-left:10px; color:var(--accent); font-weight:700;">${teamName}</span>
                    </div>
                    ${player.steam ? `
                        <a href="${player.steam}" target="_blank" class="btn-steam">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                            Steam
                        </a>
                    ` : ''}
                </div>
            </div>

            <div class="player-stats-grid">
                <div class="player-stat-card"><div class="num">${player.kd.toFixed(2)}</div><div class="label">K/D</div></div>
                <div class="player-stat-card"><div class="num">${player.adr}</div><div class="label">ADR</div></div>
                <div class="player-stat-card"><div class="num ${player.diff > 0 ? 'good' : 'bad'}">${player.diff > 0 ? '+' : ''}${player.diff}</div><div class="label">Разница</div></div>
                <div class="player-stat-card"><div class="num">${player.rating.toFixed(2)}</div><div class="label">Рейтинг</div></div>
            </div>

            ${sparklineHTML}

            ${achievements.length > 0 ? `
                <div class="player-achievements" style="margin-top:20px;">
                    ${achievements.map(a => `<div class="player-achievement"><span class="ach-icon">${a.icon}</span><span class="ach-name">${a.name}</span></div>`).join('')}
                </div>
            ` : ''}

            <div class="player-matches-title" style="margin-top:24px;">🤝 История встреч</div>
            <div class="h2h-list">${h2hHTML}</div>

            <div class="player-matches-title" style="margin-top:24px;">📋 История матчей <span style="font-size:11px;color:var(--muted);font-weight:400;">(кликните для перехода)</span></div>
            ${history.length > 0 ? history.map(m => {
                let streakIcon = '';
                const kd = m.k / (m.d || 1);
                if (kd >= 1.5) streakIcon = '🔥'; else if (kd < 0.5) streakIcon = '🧊';
                return `
                <div class="player-match-row" onclick="location.href='match.html?id=${getMatchId(m.match)}'">
                    <span class="match-name">${m.match} — ${m.map} ${streakIcon}</span>
                    <span class="match-stats">${m.k} - ${m.d} <span class="${m.diff > 0 ? 'good' : 'bad'}">${m.diff > 0 ? '+' : ''}${m.diff}</span><span class="match-arrow">→</span></span>
                </div>
            `}).join('') : '<div style="font-size:13px;color:var(--muted);">Нет данных о матчах</div>'}
            
            </div> <!-- КОНЕЦ КАРТОЧКИ -->
        `;
    }

    // ===== СКАЧИВАНИЕ КАРТОЧКИ =====
    function downloadCard(name) {
        const card = document.getElementById('player-card-export');
        const btnWrapper = document.getElementById('downloadBtnWrapper');
        if (!card) return;
        
        // Прячем кнопку скачивания, чтобы она не попала на картинку
        if (btnWrapper) btnWrapper.style.display = 'none';

        html2canvas(card, {
            backgroundColor: '#0a0a0a',
            scale: 2,
            useCORS: true
        }).then(canvas => {
            // Возвращаем кнопку на место
            if (btnWrapper) btnWrapper.style.display = 'block';

            // Создаем ссылку для скачивания
            const link = document.createElement('a');
            link.download = `MPL_${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }

    // ===== НАСТРОЙКИ =====
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }
    function setAccent(color) {
        document.documentElement.style.setProperty('--accent', color);
        localStorage.setItem('mpl_accent', color);
    }
    function resetBg() {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = 'var(--bg)';
        localStorage.removeItem('mpl_bg');
        document.getElementById('bgUpload').value = '';
    }
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const bgUrl = event.target.result;
                document.body.style.backgroundImage = `url(${bgUrl})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                localStorage.setItem('mpl_bg', bgUrl);
            };
            reader.readAsDataURL(file);
        }
    });
    window.addEventListener('DOMContentLoaded', () => {
        const savedAccent = localStorage.getItem('mpl_accent');
        if (savedAccent) setAccent(savedAccent);
        const savedBg = localStorage.getItem('mpl_bg');
        if (savedBg) {
            document.body.style.backgroundImage = `url(${savedBg})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        }
    });

    renderPlayerPage(playerName);
</script>
</body>
</html>
