<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль игрока</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=52">
    <style>
        .hltv-profile-header { background: var(--surface); border: 1px solid var(--border); display: flex; align-items: stretch; margin-bottom: 20px; border-radius: 4px; overflow: hidden; }
        .hltv-profile-photo { width: 180px; background: var(--bg); position: relative; display: flex; align-items: flex-end; }
        .hltv-profile-photo img.bg-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 80%; opacity: 0.1; object-fit: contain; }
        .hltv-profile-photo img.player { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
        .hltv-profile-info { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        
        .hltv-profile-name { font-size: 32px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        
        /* КНОПКА STEAM */
        .btn-steam { 
            position: absolute; top: 20px; right: 24px; display: inline-flex; align-items: center; gap: 8px; 
            background: var(--surface-2); border: 1px solid #66c0f4; color: #66c0f4; 
            padding: 6px 14px; font-family: var(--mono); font-size: 11px; font-weight: 700; 
            text-decoration: none; text-transform: uppercase; letter-spacing: 1px; 
            transition: 0.2s; border-radius: 4px;
        }
        .btn-steam:hover { background: #66c0f4; color: #000; box-shadow: 0 0 15px rgba(102, 192, 244, 0.4); }
        .btn-steam svg { width: 14px; height: 14px; fill: currentColor; }

        .hltv-info-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .hltv-info-table td { padding: 6px 0; border-bottom: 1px solid var(--border); }
        .hltv-info-table td:first-child { color: var(--muted); width: 140px; }
        .hltv-info-table td:last-child { color: var(--text); font-weight: 600; text-align: right; }
        
        .hltv-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-top: none; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .hltv-tab { padding: 12px 24px; font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.15s; }
        .hltv-tab:hover { color: var(--text); background: var(--surface-2); }
        .hltv-tab.active { color: var(--text); border-bottom-color: var(--accent); }
        
        .tab-content { display: none; animation: fadeUp 0.3s ease; }
        .tab-content.active { display: block; }
        
        .hltv-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .hltv-stats-grid { grid-template-columns: 1fr; } }
        
        .hltv-stat-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
        .hltv-stat-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px; display: flex; justify-content: space-between; }
        .hltv-stat-row { margin-bottom: 12px; }
        .hltv-stat-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text); margin-bottom: 4px; }
        .hltv-stat-bar-bg { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
        .hltv-stat-bar-fill { height: 100%; background: #66c0f4; }
        
        .hltv-matches-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
        .hltv-match-row-simple { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .hltv-match-row-simple:last-child { border-bottom: none; }
        .hltv-match-team-simple { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--text); }
        .hltv-match-team-simple img { width: 24px; height: 24px; object-fit: contain; }
        .hltv-match-score-simple { font-family: var(--mono); font-size: 14px; font-weight: 800; }
        .hltv-match-score-simple.win { color: var(--success); }
        .hltv-match-score-simple.loss { color: var(--danger); }

        .hltv-matches-tab-box { background: var(--surface); border: 1px solid var(--border); margin-bottom: 20px; }
        .hltv-matches-tab-title { background: var(--surface-2); padding: 12px 16px; font-size: 14px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); }
        .hltv-event-header { background: var(--surface-2); padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); }
        .hltv-match-table { width: 100%; border-collapse: collapse; }
        .hltv-match-table th { text-align: left; padding: 10px 16px; font-size: 11px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .hltv-match-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); vertical-align: middle; }
        
        .hltv-match-team-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
        .hltv-match-team-cell img { width: 24px; height: 24px; object-fit: contain; }
        .hltv-match-vs-cell { text-align: center; font-family: var(--mono); font-weight: 800; }
        .hltv-match-vs-cell .win { color: var(--success); }
        .hltv-match-vs-cell .loss { color: var(--danger); }
        
        .btn-stats { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.2s; float: right; padding: 4px 12px; }
        .btn-stats:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="theme-terminal">
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div>
                    <select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;">
                        <option value="theme-terminal">Terminal (Зеленая)</option>
                        <option value="theme-cyberpunk">Cyberpunk (Розовая)</option>
                        <option value="theme-ocean">Ocean (Синяя)</option>
                        <option value="theme-blood">Blood Moon (Красная)</option>
                        <option value="theme-matrix">Matrix (Черно-зеленая)</option>
                    </select>
                </div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn active">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div id="playerContent"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    // ==== ОПРЕДЕЛЕНИЕ ТЕМ ====
    const themes = {
        'theme-terminal': { '--bg': '#0a0a0a', '--surface': '#101010', '--surface-2': '#161616', '--border': '#262626', '--text': '#e8e8e8', '--muted': '#737373', '--accent': '#c8ff00', '--success': '#00ff88', '--danger': '#ff3b3b' },
        'theme-cyberpunk': { '--bg': '#0b0c10', '--surface': '#15171e', '--surface-2': '#1f232c', '--border': '#2e3440', '--text': '#f0f4f8', '--muted': '#8b9bb0', '--accent': '#ff0055', '--success': '#00d2ff', '--danger': '#ff3b3b' },
        'theme-ocean': { '--bg': '#050a15', '--surface': '#0a1428', '--surface-2': '#0f1c38', '--border': '#1a2c4e', '--text': '#e0e8f0', '--muted': '#6e8fb0', '--accent': '#00d2ff', '--success': '#00ff88', '--danger': '#ff3b3b' },
        'theme-blood': { '--bg': '#0d0404', '--surface': '#160707', '--surface-2': '#240c0c', '--border': '#3a1414', '--text': '#f0e6e6', '--muted': '#9e7373', '--accent': '#ff3b3b', '--success': '#ffb020', '--danger': '#c0392b' },
        'theme-matrix': { '--bg': '#000000', '--surface': '#050505', '--surface-2': '#0a0a0a', '--border': '#112211', '--text': '#00ff41', '--muted': '#008f11', '--accent': '#00ff41', '--success': '#00ff88', '--danger': '#ff3b3b' }
    };

    function applyTheme(themeName) {
        const theme = themes[themeName];
        if (!theme) return;
        for (const [key, value] of Object.entries(theme)) {
            document.documentElement.style.setProperty(key, value);
        }
    }

    function changeTheme(themeName) {
        localStorage.setItem('mpl_theme', themeName);
        applyTheme(themeName);
    }

    // ==== ЛОГИКА ПРОФИЛЯ ====
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name');

    const tf2Roster = ['bomba69', 'Хомяк с авт', 'uxaxaxaxa', 'AFKE'];
    const magicRoster = ['abdalbek', 'Gonduras228', 'Adjiare Gudju', 'baksyhanovvand...'];
    const defaultImg = 'img/default.png';
    const tf2Logo = 'img/tf2.png';
    const magicLogo = 'img/magic.png';
    const shieldSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 2L2 22h20L12 2z'/></svg>`;
    const flagSVG = `<svg viewBox="0 0 100 70" style="width:24px; height:16px; border-radius:2px; display:inline-block; vertical-align:middle; margin-right:8px;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;

    const playerAges = {
        'bomba69': 14, 'Хомяк с авт': 14, 'uxaxaxaxa': 14, 'AFKE': 14, 'abdalbek': 14,
        'Gonduras228': 14, 'baksyhanovvand...': 14, 'Adjiare Gudju': 15
    };

    function getTeamLogo(teamName) {
        if (teamName.includes('Fortress') || teamName === 'Team Fortress 2') return tf2Logo;
        if (teamName.includes('Magic') || teamName === 'Team Magic') return magicLogo;
        return shieldSVG;
    }

    function renderPlayerPage(name) {
        const container = document.getElementById('playerContent');
        if (!name) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не выбран</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }
        const player = playersData.find(p => p.name === name);
        if (!player) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не найден</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }

        let teamLogo = shieldSVG;
        let teamName = 'Без команды';
        if (tf2Roster.includes(player.name)) { teamLogo = tf2Logo; teamName = 'Team Fortress 2'; }
        else if (magicRoster.includes(player.name)) { teamLogo = magicLogo; teamName = 'Team Magic'; }

        const age = playerAges[player.name] || 14;
        const allSorted = [...playersData].sort((a, b) => b.rating - a.rating);
        const rank = allSorted.findIndex(p => p.name === player.name) + 1;

        const playedMatches = [];
        Object.keys(matchData).forEach(key => {
            const m = matchData[key];
            const teams = m.teams || (m.total && m.total.teams);
            if (!teams) return;
            
            let isInMatch = false;
            let playerTeamSide = ''; 
            
            if (teams.win.players.some(p => p.name === player.name)) { isInMatch = true; playerTeamSide = 'win'; }
            if (teams.loss.players.some(p => p.name === player.name)) { isInMatch = true; playerTeamSide = 'loss'; }
            
            if (isInMatch) {
                const score1 = parseInt(m.score.split(':')[0]);
                const score2 = parseInt(m.score.split(':')[1]);
                
                let actualWinnerName = score1 > score2 ? m.winner : m.loser;
                let actualLoserName = score1 > score2 ? m.loser : m.winner;
                
                let playerTeamName = '';
                let enemyTeamName = '';
                let playerScore = 0;
                let enemyScore = 0;

                if (playerTeamSide === 'win') {
                    playerTeamName = actualWinnerName; 
                    enemyTeamName = actualLoserName;
                    playerScore = score1; 
                    enemyScore = score2;
                } else {
                    playerTeamName = actualLoserName;
                    enemyTeamName = actualWinnerName;
                    playerScore = score2; 
                    enemyScore = score1;
                }

                const isWinByScore = playerScore > enemyScore;

                playedMatches.push({ 
                    id: key, data: m, isWin: isWinByScore, playerTeamName: playerTeamName,
                    enemyTeamName: enemyTeamName, playerScore: playerScore, enemyScore: enemyScore
                });
            }
        });
        
        playedMatches.sort((a, b) => new Date(b.data.date) - new Date(a.data.date));

        const recentMatchesHTML = playedMatches.slice(0, 5).map(m => {
            const enemyLogo = getTeamLogo(m.enemyTeamName);
            return `
                <div class="hltv-match-row-simple">
                    <div class="hltv-match-team-simple">
                        <span style="color:var(--muted); width: 30px; font-size:10px;">VS</span>
                        <img src="${enemyLogo}" onerror="this.src='${shieldSVG}';">
                        <span>${m.enemyTeamName}</span>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end;">
                        <span class="hltv-match-score-simple ${m.isWin ? 'win' : 'loss'}">${m.playerScore} : ${m.enemyScore}</span>
                        <span style="font-size:10px; color:var(--muted);">${m.data.date}</span>
                    </div>
                </div>
            `;
        }).join('');

        let matchTableHTML = `
            <div class="hltv-event-header">MPL Season 1</div>
            <table class="hltv-match-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">Date</th>
                        <th>Matches</th>
                        <th style="width: 60px; text-align:right;"></th>
                    </tr>
                </thead>
                <tbody>
                    ${playedMatches.map(m => {
                        const playerLogo = getTeamLogo(m.playerTeamName);
                        const enemyLogo = getTeamLogo(m.enemyTeamName);
                        return `
                            <tr>
                                <td style="color:var(--muted); font-family:var(--mono);">${m.data.date}</td>
                                <td>
                                    <div style="display:flex; align-items:center; justify-content:space-between; padding-right:20px;">
                                        <div class="hltv-match-team-cell" style="width: 40%; justify-content:flex-end; padding-right: 10px;">
                                            <span>${m.playerTeamName}</span>
                                            <img src="${playerLogo}" onerror="this.src='${shieldSVG}';">
                                        </div>
                                        <div class="hltv-match-vs-cell" style="width: 20%;">
                                            <span class="${m.isWin ? 'win' : 'loss'}">${m.playerScore}</span> : <span class="${m.isWin ? 'loss' : 'win'}">${m.enemyScore}</span>
                                        </div>
                                        <div class="hltv-match-team-cell" style="width: 40%; padding-left: 10px;">
                                            <img src="${enemyLogo}" onerror="this.src='${shieldSVG}';">
                                            <span>${m.enemyTeamName}</span>
                                        </div>
                                    </div>
                                </td>
                                <td style="text-align:right;">
                                    <button class="btn-stats" onclick="location.href='match.html?id=${m.id}'">Stats</button>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;

        container.innerHTML = `
            <a href="players.html" class="back-btn">← Назад к списку игроков</a>
            
            <div class="hltv-profile-header">
                <div class="hltv-profile-photo">
                    <img src="${teamLogo}" class="bg-logo">
                    <img src="${defaultImg}" class="player">
                </div>
                <div class="hltv-profile-info">
                    <div class="hltv-profile-name">
                        ${flagSVG} ${player.name} ${player.you ? '<span style="color:var(--accent);font-size:24px;">⭐</span>' : ''}
                    </div>
                    
                    ${player.steam ? `
                        <a href="${player.steam}" target="_blank" class="btn-steam">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                            Steam
                        </a>
                    ` : ''}

                    <table class="hltv-info-table" style="margin-top: 10px;">
                        <tr><td>Возраст</td><td>${age} лет</td></tr>
                        <tr><td>Текущая команда</td><td><img src="${teamLogo}" style="width:16px; height:16px; display:inline-block; vertical-align:middle; margin-right:6px;" onerror="this.src='${shieldSVG}';"> ${teamName}</td></tr>
                        <tr><td>Место в топе (Rating)</td><td>#${rank}</td></tr>
                    </table>
                </div>
            </div>

            <div class="hltv-tabs">
                <div class="hltv-tab active" onclick="switchProfileTab('info')" id="tab-info">Info</div>
                <div class="hltv-tab" onclick="switchProfileTab('teams')" id="tab-teams">Teams</div>
                <div class="hltv-tab" onclick="switchProfileTab('matches')" id="tab-matches">Matches</div>
            </div>

            <div class="tab-content active" id="content-info">
                <div class="hltv-stats-grid">
                    <div class="hltv-stat-box">
                        <div class="hltv-stat-title">Статистика игрока (Rating 3.0)</div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Rating 3.0</span><span>${player.rating.toFixed(2)}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.rating / 2) * 100)}%; background:${player.rating > 1.2 ? 'var(--success)' : '#66c0f4'};"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Firepower (K/D)</span><span>${player.kd.toFixed(2)}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.kd / 2) * 100)}%;"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>ADR</span><span>${player.adr}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.adr / 150) * 100)}%;"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Entrying (Убийства)</span><span>${player.k}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.k / 150) * 100)}%;"></div></div>
                        </div>
                    </div>

                    <div class="hltv-matches-box">
                        <div class="hltv-stat-title" style="margin-bottom:16px;">Последние матчи</div>
                        ${recentMatchesHTML || '<div style="font-size:12px;color:var(--muted);">Нет матчей</div>'}
                    </div>
                </div>
            </div>

            <div class="tab-content" id="content-teams">
                <div class="hltv-stat-box">
                    <div class="hltv-stat-title">История команд</div>
                    <div style="display:flex; align-items:center; gap:16px; padding:12px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:10px;">
                        <img src="${teamLogo}" style="width:40px; height:40px; object-fit:contain;" onerror="this.src='${shieldSVG}';">
                        <div>
                            <div style="font-size:16px; font-weight:700; color:var(--text);">${teamName}</div>
                            <div style="font-size:12px; color:var(--success);">Текущая команда</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="content-matches">
                <div class="hltv-matches-tab-box">
                    <div class="hltv-matches-tab-title">Latest results</div>
                    ${matchTableHTML}
                </div>
            </div>
        `;
    }

    function switchProfileTab(tab) {
        document.querySelectorAll('.hltv-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('content-' + tab).classList.add('active');
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }

    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal';
        applyTheme(savedTheme);
        const select = document.getElementById('themeSelect'); if (select) select.value = savedTheme;
        
        const savedBg = localStorage.getItem('mpl_bg'); 
        if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
    });

    renderPlayerPage(playerName);
</script>
</body>
</html>
