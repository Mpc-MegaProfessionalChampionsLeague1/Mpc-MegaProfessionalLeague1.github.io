<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Профиль игрока</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=30">
    <style>
        /* Шапка профиля HLTV */
        .hltv-profile-header {
            background: #1f232b; border: 1px solid var(--border);
            display: flex; align-items: stretch; margin-bottom: 20px; border-radius: 4px; overflow: hidden;
        }
        .hltv-profile-photo {
            width: 180px; background: #111; position: relative; display: flex; align-items: flex-end;
        }
        .hltv-profile-photo img.bg-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 80%; opacity: 0.1; object-fit: contain; }
        .hltv-profile-photo img.player { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
        
        .hltv-profile-info { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; justify-content: center; }
        .hltv-profile-name { font-size: 32px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        
        .hltv-info-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .hltv-info-table td { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hltv-info-table td:first-child { color: #8b9bb0; width: 140px; }
        .hltv-info-table td:last-child { color: #fff; font-weight: 600; text-align: right; }
        
        /* Вкладки */
        .hltv-tabs { display: flex; background: #171a21; border: 1px solid var(--border); border-top: none; border-bottom: 2px solid #111; margin-bottom: 20px; }
        .hltv-tab { padding: 12px 24px; font-family: var(--sans); font-size: 14px; font-weight: 600; color: #8b9bb0; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.15s; }
        .hltv-tab:hover { color: #fff; background: rgba(255,255,255,0.03); }
        .hltv-tab.active { color: #fff; border-bottom-color: var(--accent); }
        
        /* Контент вкладок */
        .tab-content { display: none; animation: fadeUp 0.3s ease; }
        .tab-content.active { display: block; }
        
        /* Сетка контента */
        .hltv-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .hltv-stats-grid { grid-template-columns: 1fr; } }
        
        /* Блок статистики (слева) */
        .hltv-stat-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
        .hltv-stat-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; }
        .hltv-stat-row { margin-bottom: 12px; }
        .hltv-stat-label { display: flex; justify-content: space-between; font-size: 12px; color: #c8d6e0; margin-bottom: 4px; }
        .hltv-stat-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .hltv-stat-bar-fill { height: 100%; background: #66c0f4; } /* HLTV blue */
        
        /* Блок матчей (справа) */
        .hltv-matches-box { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
        .hltv-match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hltv-match-row:last-child { border-bottom: none; }
        .hltv-match-team { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #fff; }
        .hltv-match-team img { width: 24px; height: 24px; object-fit: contain; }
        .hltv-match-score { font-family: var(--mono); font-size: 14px; font-weight: 800; }
        .hltv-match-score.win { color: var(--success); }
        .hltv-match-score.loss { color: var(--danger); }

        /* Настройки */
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: #1a1e26; border: 1px solid #444; border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:#fff; border-bottom:1px solid #333; padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Цвет акцента:</div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="setAccent('#c8ff00')" style="width:24px; height:24px; background:#c8ff00; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#00d2ff')" style="width:24px; height:24px; background:#00d2ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ff0055')" style="width:24px; height:24px; background:#ff0055; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#b000ff')" style="width:24px; height:24px; background:#b000ff; border:none; border-radius:4px; cursor:pointer;"></button>
                        <button onclick="setAccent('#ffb347')" style="width:24px; height:24px; background:#ffb347; border:none; border-radius:4px; cursor:pointer;"></button>
                    </div>
                </div>
                <div>
                    <div style="font-size:11px; color:#8b9bb0; margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:#fff; background:#111; border:1px solid #333; padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:#333; border:none; color:#fff; padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn active">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div id="playerContent"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name');

    const tf2Roster = ['bomba69', 'Хомяк с авт', 'uxaxaxaxa', 'AFKE'];
    const magicRoster = ['abdalbek', 'Gonduras228', 'Adjiare Gudju', 'baksyhanovvand...'];
    const defaultImg = 'img/default.png';
    const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`;
    const flagSVG = `<svg viewBox="0 0 100 70" style="width:24px; height:16px; border-radius:2px; display:inline-block; vertical-align:middle; margin-right:8px;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;

    // Возраст игроков
    const playerAges = {
        'bomba69': 14, 'Хомяк с авт': 14, 'uxaxaxaxa': 14, 'AFKE': 14, 'abdalbek': 14,
        'Gonduras228': 14, 'baksyhanovvand...': 14, 'Adjiare Gudju': 15
    };

    function renderPlayerPage(name) {
        const container = document.getElementById('playerContent');
        if (!name) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не выбран</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }
        const player = playersData.find(p => p.name === name);
        if (!player) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;"><div style="font-size:20px;font-weight:700;color:var(--text);">Игрок не найден</div><div style="color:var(--muted);margin-top:8px;"><a href="players.html" style="color:var(--accent);">Вернуться к списку</a></div></div>`;
            return;
        }

        const history = (typeof playerMatchHistory !== 'undefined' && playerMatchHistory[player.name]) ? playerMatchHistory[player.name] : [];
        
        let teamLogo = fallbackSVG;
        let teamName = 'Без команды';
        if (tf2Roster.includes(player.name)) { teamLogo = 'img/tf2.png'; teamName = 'Team Fortress 2'; }
        else if (magicRoster.includes(player.name)) { teamLogo = 'img/magic.png'; teamName = 'Team Magic'; }

        const age = playerAges[player.name] || 14;
        
        // Ищем место в топе (по рейтингу)
        const allSorted = [...playersData].sort((a, b) => b.rating - a.rating);
        const rank = allSorted.findIndex(p => p.name === player.name) + 1;

        // Ищем матчи, в которых игрок участвовал
        const playedMatches = [];
        Object.keys(matchData).forEach(key => {
            const m = matchData[key];
            const teams = m.teams || (m.total && m.total.teams);
            if (!teams) return;
            let isInMatch = false;
            ['win', 'loss'].forEach(side => {
                if (teams[side].players.some(p => p.name === player.name)) isInMatch = true;
            });
            if (isInMatch) playedMatches.push({ id: key, data: m });
        });
        playedMatches.sort((a, b) => new Date(b.data.date) - new Date(a.data.date));

        // Генерируем список последних матчей для правой колонки
        const recentMatchesHTML = playedMatches.slice(0, 5).map(m => {
            const isWin = m.data.teams?.win?.players.some(p => p.name === player.name) || m.data.total?.teams.win.players.some(p => p.name === player.name);
            const opponentName = m.data.winner.includes('Team 1') ? m.data.loser : m.data.winner;
            const opponentLogo = opponentName.includes('Team Fortress') || opponentName === 'Team 1' ? (teamName === 'Team Fortress 2' ? 'img/magic.png' : 'img/tf2.png') : fallbackSVG;
            
            // Форматируем счет для BO3
            let scoreStr = m.data.score;
            if (m.data.map1) scoreStr = m.data.score; 

            return `
                <div class="hltv-match-row">
                    <div class="hltv-match-team">
                        <span style="color:#8b9bb0; width: 30px; font-size:10px;">VS</span>
                        <img src="${opponentLogo}" onerror="this.src='${fallbackSVG}';">
                        <span>${opponentName}</span>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end;">
                        <span class="hltv-match-score ${isWin ? 'win' : 'loss'}">${scoreStr}</span>
                        <span style="font-size:10px; color:#6e7f94;">${m.data.date}</span>
                    </div>
                </div>
            `;
        }).join('');

        container.innerHTML = `
            <a href="players.html" class="back-btn">← Назад к списку игроков</a>
            
            <div class="hltv-profile-header">
                <div class="hltv-profile-photo">
                    <img src="${teamLogo}" class="bg-logo">
                    <img src="${defaultImg}" class="player">
                </div>
                <div class="hltv-profile-info">
                    <div class="hltv-profile-name">
                        ${flagSVG} ${player.name}
                        ${player.you ? '<span style="color:var(--accent);font-size:24px;">⭐</span>' : ''}
                    </div>
                    <table class="hltv-info-table">
                        <tr><td>Возраст</td><td>${age} лет</td></tr>
                        <tr><td>Текущая команда</td><td><img src="${teamLogo}" style="width:16px; height:16px; display:inline-block; vertical-align:middle; margin-right:6px;" onerror="this.src='${fallbackSVG}';"> ${teamName}</td></tr>
                        <tr><td>Место в топе (Rating)</td><td>#${rank}</td></tr>
                    </table>
                </div>
            </div>

            <div class="hltv-tabs">
                <div class="hltv-tab active" onclick="switchProfileTab('info')" id="tab-info">Info</div>
                <div class="hltv-tab" onclick="switchProfileTab('teams')" id="tab-teams">Teams</div>
                <div class="hltv-tab" onclick="switchProfileTab('matches')" id="tab-matches">Matches</div>
            </div>

            <!-- ВКЛАДКА INFO -->
            <div class="tab-content active" id="content-info">
                <div class="hltv-stats-grid">
                    <!-- Левая колонка: Статистика -->
                    <div class="hltv-stat-box">
                        <div class="hltv-stat-title">Статистика игрока (Rating 3.0)</div>
                        
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Rating 3.0</span><span>${player.rating.toFixed(2)}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.rating / 2) * 100)}%; background:${player.rating > 1.2 ? '#7ddfa0' : '#66c0f4'};"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Firepower (K/D)</span><span>${player.kd.toFixed(2)}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.kd / 2) * 100)}%;"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>ADR</span><span>${player.adr}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.adr / 150) * 100)}%;"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Entrying (Убийства)</span><span>${player.k}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.k / 150) * 100)}%;"></div></div>
                        </div>
                        <div class="hltv-stat-row">
                            <div class="hltv-stat-label"><span>Utility (Ассисты)</span><span>${player.a}</span></div>
                            <div class="hltv-stat-bar-bg"><div class="hltv-stat-bar-fill" style="width:${Math.min(100, (player.a / 30) * 100)}%;"></div></div>
                        </div>
                    </div>

                    <!-- Правая колонка: Последние матчи -->
                    <div class="hltv-matches-box">
                        <div class="hltv-stat-title" style="margin-bottom:16px;">Последние матчи</div>
                        ${recentMatchesHTML || '<div style="font-size:12px;color:#8b9bb0;">Нет матчей</div>'}
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА TEAMS -->
            <div class="tab-content" id="content-teams">
                <div class="hltv-stat-box">
                    <div class="hltv-stat-title">История команд</div>
                    <div style="display:flex; align-items:center; gap:16px; padding:12px; background:#1a1e26; border:1px solid var(--border); margin-bottom:10px;">
                        <img src="${teamLogo}" style="width:40px; height:40px; object-fit:contain;">
                        <div>
                            <div style="font-size:16px; font-weight:700; color:#fff;">${teamName}</div>
                            <div style="font-size:12px; color:var(--success);">Текущая команда</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА MATCHES -->
            <div class="tab-content" id="content-matches">
                <div class="hltv-stat-box">
                    <div class="hltv-stat-title">Все матчи (${playedMatches.length})</div>
                    ${playedMatches.map(m => `
                        <div class="hltv-match-row" style="cursor:pointer;" onclick="location.href='match.html?id=${m.id}'">
                            <div class="hltv-match-team">
                                <span style="color:#8b9bb0; width: 30px; font-size:10px;">VS</span>
                                <img src="${m.data.loser.includes('Team Fortress') || m.data.loser === 'Team 1' ? 'img/tf2.png' : 'img/magic.png'}">
                                <span>${m.data.winner.includes('Team 1') ? m.data.loser : m.data.winner}</span>
                            </div>
                            <div class="hltv-match-score ${m.data.teams?.win?.players.some(p => p.name === player.name) ? 'win' : 'loss'}">
                                ${m.data.score}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function switchProfileTab(tab) {
        document.querySelectorAll('.hltv-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('content-' + tab).classList.add('active');
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }
    function setAccent(color) { document.documentElement.style.setProperty('--accent', color); localStorage.setItem('mpl_accent', color); }
    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); }
    });
    window.addEventListener('DOMContentLoaded', () => {
        const savedAccent = localStorage.getItem('mpl_accent'); if (savedAccent) setAccent(savedAccent);
        const savedBg = localStorage.getItem('mpl_bg'); if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
    });

    renderPlayerPage(playerName);
</script>
</body>
</html>
