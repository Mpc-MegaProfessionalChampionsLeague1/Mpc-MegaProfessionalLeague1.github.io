<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL - Турнир</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=51">
    <style>
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .team-card { background: var(--surface); border: 1px solid var(--border); padding: 20px 10px; text-align: center; border-radius: 0; transition: 0.2s; }
        .team-card:hover { border-color: var(--border-2); }
        .team-logo-placeholder { width: 60px; height: 60px; background: var(--surface-2); border: 1px dashed var(--border-2); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: var(--dim); font-size: 24px; }
        .team-name { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--muted); }
        .prize-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .prize-card { background: var(--surface-2); padding: 15px; border: 1px solid var(--border); text-align: center; border-radius: 0; }
        
        #settingsPanel { display: none; position: absolute; top: 60px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 250px; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
<div class="container" id="app" style="display: none;">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>tournament</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
            <button class="theme-toggle" onclick="toggleSettings()" id="settingsBtn" title="Настройки">⚙️</button>
            
            <!-- ПАНЕЛЬ НАСТРОЕК (КАК НА ГЛАВНОЙ) -->
            <div id="settingsPanel">
                <div style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px;">🎨 Настройки сайта</div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Тема оформления:</div>
                    <select id="themeSelect" onchange="changeTheme(this.value)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:6px; border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;">
                        <option value="theme-terminal">Terminal (Зеленая)</option>
                        <option value="theme-cyberpunk">Cyberpunk (Розовая)</option>
                        <option value="theme-ocean">Ocean (Синяя)</option>
                        <option value="theme-blood">Blood Moon (Красная)</option>
                        <option value="theme-matrix">Matrix (Черно-зеленая)</option>
                    </select>
                </div>
                <div>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Свой фон (картинка):</div>
                    <input type="file" id="bgUpload" accept="image/*" style="width:100%; font-size:10px; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:4px; border-radius:4px; cursor:pointer;">
                    <button onclick="resetBg()" style="width:100%; margin-top:6px; background:var(--surface-2); border:none; color:var(--text); padding:6px; border-radius:4px; font-size:10px; cursor:pointer;">Сбросить фон</button>
                </div>
            </div>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <div style="margin: 20px 0;">
        <a href="tournaments.html" class="back-btn">← Назад к турнирам</a>
    </div>

    <div class="glass-card" style="padding: 0; overflow: hidden; margin-bottom: 20px; border: 2px solid var(--border-2);">
        <div style="background: var(--surface-2); padding: 40px 20px; text-align: center; position: relative; border-bottom: 2px solid var(--accent);">
            <div style="position: absolute; top: 15px; right: 15px; background: var(--accent); color: #000; font-family: var(--mono); font-size: 10px; font-weight: 800; padding: 4px 10px; text-transform: uppercase;">
                <span id="t-status">UPCOMING</span>
            </div>
            <h1 style="font-family: var(--mono); font-size: 42px; font-weight: 800; color: var(--text); letter-spacing: -2px; margin: 0;" id="t-name">TBD</h1>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-bottom: 1px solid var(--border);">
            <div style="padding: 15px; border-right: 1px solid var(--border);">
                <div style="font-size: 10px; color: var(--muted); text-transform: uppercase; font-family: var(--mono); margin-bottom: 4px;">Даты</div>
                <div style="font-size: 13px; font-weight: 600;" id="t-dates">TBD</div>
            </div>
            <div style="padding: 15px; border-right: 1px solid var(--border);">
                <div style="font-size: 10px; color: var(--muted); text-transform: uppercase; font-family: var(--mono); margin-bottom: 4px;">Призовой фонд</div>
                <div style="font-size: 13px; font-weight: 600;" id="t-prize">TBD</div>
            </div>
            <div style="padding: 15px; border-right: 1px solid var(--border);">
                <div style="font-size: 10px; color: var(--muted); text-transform: uppercase; font-family: var(--mono); margin-bottom: 4px;">Команд</div>
                <div style="font-size: 13px; font-weight: 600;" id="t-teams-count">TBD</div>
            </div>
            <div style="padding: 15px;">
                <div style="font-size: 10px; color: var(--muted); text-transform: uppercase; font-family: var(--mono); margin-bottom: 4px;">Локация</div>
                <div style="font-size: 13px; font-weight: 600;" id="t-location">TBD</div>
            </div>
        </div>
        
        <div class="tabs-container" style="margin: 0; border: none; border-bottom: 1px solid var(--border);">
            <button class="tab-btn active" style="flex: 1; padding: 15px;">Обзор</button>
            <button class="tab-btn" style="flex: 1; padding: 15px;">Матчи (TBD)</button>
            <button class="tab-btn" style="flex: 1; padding: 15px;">Сетка (TBD)</button>
        </div>
    </div>

    <h2 class="panel-title">Участники <span>Team list</span></h2>
    <div class="teams-grid" id="teams-container"></div>

    <h2 class="panel-title" style="margin-top: 30px;">Распределение призовых <span>Prize distribution</span></h2>
    <div class="prize-grid" id="prize-container"></div>
    <div class="footer">MPL · Mega Professional League · <b>TOURNAMENT</b></div>
</div>

<script>
    // ==========================================
    // 1. СИНХРОНИЗАЦИЯ ТЕМ (КАК В INDEX.HTML)
    // ==========================================
    const themes = {
        'theme-terminal': { '--bg': '#0a0a0a', '--surface': '#101010', '--surface-2': '#161616', '--border': '#262626', '--text': '#e8e8e8', '--muted': '#737373', '--dim': '#4a4a4a', '--accent': '#c8ff00', '--success': '#00ff88', '--danger': '#ff3b3b' },
        'theme-cyberpunk': { '--bg': '#0b0c10', '--surface': '#15171e', '--surface-2': '#1f232c', '--border': '#2e3440', '--text': '#f0f4f8', '--muted': '#8b9bb0', '--dim': '#4a5a6e', '--accent': '#ff0055', '--success': '#00d2ff', '--danger': '#ff3b3b' },
        'theme-ocean': { '--bg': '#050a15', '--surface': '#0a1428', '--surface-2': '#0f1c38', '--border': '#1a2c4e', '--text': '#e0e8f0', '--muted': '#6e8fb0', '--dim': '#3a5a7a', '--accent': '#00d2ff', '--success': '#00ff88', '--danger': '#ff3b3b' },
        'theme-blood': { '--bg': '#0d0404', '--surface': '#160707', '--surface-2': '#240c0c', '--border': '#3a1414', '--text': '#f0e6e6', '--muted': '#9e7373', '--dim': '#5e3a3a', '--accent': '#ff3b3b', '--success': '#ffb020', '--danger': '#c0392b' },
        'theme-matrix': { '--bg': '#000000', '--surface': '#050505', '--surface-2': '#0a0a0a', '--border': '#112211', '--text': '#00ff41', '--muted': '#008f11', '--dim': '#004d0a', '--accent': '#00ff41', '--success': '#00ff88', '--danger': '#ff3b3b' }
    };

    function applyTheme(themeName) {
        const theme = themes[themeName];
        if (!theme) return;
        for (const [key, value] of Object.entries(theme)) {
            document.documentElement.style.setProperty(key, value);
        }
    }

    function changeTheme(themeName) {
        localStorage.setItem('mpl_theme', themeName);
        applyTheme(themeName);
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }
    function toggleSettings() { const panel = document.getElementById('settingsPanel'); panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }
    function resetBg() { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'var(--bg)'; localStorage.removeItem('mpl_bg'); document.getElementById('bgUpload').value = ''; }
    
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onload = function(event) { document.body.style.backgroundImage = `url(${event.target.result})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; localStorage.setItem('mpl_bg', event.target.result); }; reader.readAsDataURL(file); }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('mpl_theme') || 'theme-terminal';
        applyTheme(savedTheme);
        const select = document.getElementById('themeSelect'); if (select) select.value = savedTheme;
        
        const savedBg = localStorage.getItem('mpl_bg'); 
        if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
    });

    // ==========================================
    // 2. ГЕНЕРАТОР И ЛОГИКА СТРАНИЦЫ
    // ==========================================
    const generate2027Tournaments = () => {
        let tournaments = [];
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const elements = ["FROST", "SNOW", "WIND", "RAIN", "STORM", "HEAT", "SUN", "DROUGHT", "LEAF", "FOG", "COLD", "BLIZZARD"];

        monthNames.forEach((monthName, index) => {
            const mNum = index + 1;
            const el = elements[index];
            const el2 = elements[(index + 3) % 12];

            if (mNum === 6) {
                tournaments.push({ id: `mpl-summer-major-2027`, name: `MPL SUMMER MAJOR 2027`, year: 2027, month: 6, status: "upcoming", dates: `Середина Июня 2027`, prizePool: "TBD (Big)", teamsCount: "16", location: "Online", teams: [], prizeDistribution: [{ place: "Champion", reward: "TBD" }, { place: "Runner-up", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `3-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 12) {
                tournaments.push({ id: `mpl-winter-major-2027`, name: `MPL WINTER MAJOR 2027`, year: 2027, month: 12, status: "upcoming", dates: `Середина Декабря 2027`, prizePool: "TBD (Big)", teamsCount: "16", location: "Online", teams: [], prizeDistribution: [{ place: "Champion", reward: "TBD" }, { place: "Runner-up", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `3-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 1) {
                tournaments.push({ id: `mpl-kickoff-2027`, name: `MPL KICKOFF 2027`, year: 2027, month: 1, status: "upcoming", dates: `1-я неделя Января 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else if (mNum === 7) {
                tournaments.push({ id: `mpl-midseason-2027`, name: `MPL MID-SEASON`, year: 2027, month: 7, status: "upcoming", dates: `1-я неделя Июля 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            } else {
                tournaments.push({ id: `mpl-ranked-${mNum}-2027`, name: `MPL ${el} RANKED`, year: 2027, month: mNum, status: "upcoming", dates: `1-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "Top 1", reward: "TBD" }] });
                tournaments.push({ id: `mpl-cup-${mNum}-2027`, name: `MPL ${el} CUP`, year: 2027, month: mNum, status: "upcoming", dates: `2-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }, { place: "2nd", reward: "TBD" }] });
                tournaments.push({ id: `mpl-open-${mNum}-2027`, name: `MPL ${el2} OPEN`, year: 2027, month: mNum, status: "upcoming", dates: `4-я неделя ${monthName} 2027`, prizePool: "Points", teamsCount: "TBD", location: "Online", teams: [], prizeDistribution: [{ place: "1st", reward: "TBD" }] });
            }
        });
        return tournaments;
    };

    const tournamentsData = [...generate2027Tournaments()];

    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tournamentId = urlParams.get('id');
        const tournament = tournamentsData.find(t => t.id === tournamentId);

        if (tournament) {
            document.getElementById('app').style.display = 'block';
            
            document.getElementById('t-name').textContent = tournament.name;
            document.getElementById('t-status').textContent = tournament.status.toUpperCase();
            document.getElementById('t-dates').textContent = tournament.dates;
            document.getElementById('t-prize').textContent = tournament.prizePool;
            document.getElementById('t-teams-count').textContent = tournament.teamsCount;
            document.getElementById('t-location').textContent = tournament.location;

            const teamsContainer = document.getElementById('teams-container');
            const teams = tournament.teams.length > 0 ? tournament.teams : Array(8).fill("TBD");
            teams.forEach(team => {
                teamsContainer.innerHTML += `
                    <div class="team-card">
                        <div class="team-logo-placeholder">?</div>
                        <div class="team-name">${team}</div>
                    </div>
                `;
            });

            const prizeContainer = document.getElementById('prize-container');
            tournament.prizeDistribution.forEach(prize => {
                prizeContainer.innerHTML += `
                    <div class="prize-card">
                        <div style="font-family: var(--mono); font-size: 14px; font-weight: 800; color: var(--accent); margin-bottom: 5px;">${prize.place}</div>
                        <div style="font-size: 12px; color: var(--muted);">${prize.reward}</div>
                    </div>
                `;
            });
        } else {
            document.body.innerHTML = '<h1 style="color:var(--text); text-align:center; margin-top:50px; font-family: monospace;">Турнир не найден. <a href="tournaments.html" style="color: var(--accent);">Вернуться</a></h1>';
        }
    });
</script>
<script src="js/nav.js"></script>
</body>
</html>
