<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL — Все игроки</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=19">
    <style>
        .player-avatar-mini {
            width: 40px; height: 40px; background: #1a1a1a; border: 1px solid #777; border-radius: 6px; 
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .player-avatar-mini .team-bg { position: absolute; width: 80%; height: 80%; opacity: 0.3; z-index: 1; object-fit: contain; }
        .player-avatar-mini .player-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1 onclick="location.href='index.html'">MPL <small>Mega Professional League</small></h1></div>
        <div class="header-right">
            <span>📅 Май-Сентябрь 2026</span>
            <span class="status">● LIVE</span>
            <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">◐</button>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-btn">01 / Главная</a>
        <a href="matches.html" class="nav-btn">02 / Матчи</a>
        <a href="players.html" class="nav-btn active">03 / Игроки</a>
        <a href="stats.html" class="nav-btn">04 / Статистика</a>
        <a href="hall.html" class="nav-btn">05 / Зал славы</a>
        <a href="about.html" class="nav-btn">06 / О сайте</a>
    </nav>

    <div class="page-title">👥 Все игроки</div>
    <div class="page-subtitle">Всего 12 игроков · Кликните на игрока для открытия профиля</div>

    <div class="filter-section">
        <input type="text" class="search-input" placeholder="🔍 Поиск по имени..." id="playerSearch" oninput="filterPlayers()">
        <select id="sortFilter" onchange="filterPlayers()">
            <option value="kd">По K/D</option>
            <option value="rating">По рейтингу</option>
            <option value="adr">По ADR</option>
            <option value="matches">По матчам</option>
        </select>
        <select id="topFilter" onchange="filterPlayers()">
            <option value="all">Все игроки</option>
            <option value="5">Топ-5</option>
            <option value="10">Топ-10</option>
        </select>
    </div>

    <div id="playersList" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
    <div class="footer">MPL · Mega Professional League · <b>TERMINAL</b> · Май-Сентябрь 2026</div>
</div>

<script src="js/data.js"></script>
<script>
    const tf2Roster = ['bomba69', 'Хомяк с авт', 'uxaxaxaxa', 'AFKE'];
    const magicRoster = ['abdalbek', 'Gonduras228', 'Adjiare Gudju', 'baksyhanovvand...'];
    const defaultImg = 'img/default.png';

    function renderPlayers(sort = 'kd', search = '', top = 'all') {
        const container = document.getElementById('playersList');
        let filtered = [...playersData];
        
        const flagSVG = `<svg viewBox="0 0 100 70" style="width:16px; height:12px; border-radius:2px; display:inline-block; vertical-align:middle; margin-right:6px;"><rect width="100" height="23.3" fill="#fff"/><rect y="23.3" width="100" height="23.3" fill="#0039a6"/><rect y="46.6" width="100" height="23.4" fill="#d52b1e"/></svg>`;
        // Серый щит для запасных
        const freeAgentSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'><path d='M12 2L2 22h20L12 2z'/></svg>`;

        if (search) {
            const s = search.toLowerCase();
            filtered = filtered.filter(p => p.name.toLowerCase().includes(s));
        }
        if (top === '5') filtered = filtered.slice(0, 5);
        else if (top === '10') filtered = filtered.slice(0, 10);

        filtered.sort((a, b) => {
            if (sort === 'kd') return b.kd - a.kd;
            if (sort === 'rating') return b.rating - a.rating;
            if (sort === 'adr') return b.adr - a.adr;
            return b.matches - a.matches;
        });

        container.innerHTML = filtered.map((p, i) => {
            let teamLogo = freeAgentSVG; // По умолчанию серый щит
            if (tf2Roster.includes(p.name)) teamLogo = 'img/tf2.png';
            else if (magicRoster.includes(p.name)) teamLogo = 'img/magic.png';
            
            return `
            <div class="glass-card" style="cursor:pointer;padding:12px 14px;transition:0.2s;" 
                 onclick="location.href='player.html?name=${encodeURIComponent(p.name)}'"
                 onmouseover="this.style.transform='translateY(-2px)';this.style.borderColor='var(--accent)';"
                 onmouseout="this.style.transform='none';this.style.borderColor='var(--border)';">
                <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-weight:700;font-size:13px;color:var(--muted);min-width:22px;">#${i+1}</span>
                    
                    <div class="player-avatar-mini">
                        <img src="${teamLogo}" class="team-bg">
                        <img src="${defaultImg}" class="player-img">
                    </div>
                    
                    <div style="flex:1;">
                        <div style="font-weight:600;font-size:14px;color:var(--text);">${flagSVG} ${p.name} ${p.you ? '⭐' : ''}</div>
                        <div style="font-size:11px;color:var(--muted);">${p.matches} матчей · ${p.k} убийств · ${p.d} смертей</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:16px;font-weight:700;color:var(--accent);">${p.kd.toFixed(2)}</div>
                        <div style="font-size:10px;color:var(--muted);">K/D</div>
                    </div>
                    <div style="text-align:right;min-width:44px;">
                        <div style="font-size:14px;font-weight:600;color:#7a9bcb;">${p.rating.toFixed(2)}</div>
                        <div style="font-size:10px;color:var(--muted);">Рейтинг</div>
                    </div>
                    <div style="color:var(--muted);font-size:18px;margin-left:4px;">→</div>
                </div>
            </div>
        `}).join('');

        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px 0;font-size:13px;grid-column:1/-1;">Игроки не найдены</div>';
        }
    }

    function filterPlayers() {
        const search = document.getElementById('playerSearch').value;
        const sort = document.getElementById('sortFilter').value;
        const top = document.getElementById('topFilter').value;
        renderPlayers(sort, search, top);
    }

    function toggleTheme() { document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '◐'; }
    let lang = 'ru';
    function toggleLang() { lang = lang === 'ru' ? 'en' : 'ru'; document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU'; }

    renderPlayers();
</script>
</body>
</html>
